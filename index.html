            fecharModalRemocao();
            renderCaminhao(veiculoAtual);
            renderVeiculos();
            renderEstoque();
            renderRelatorios();
            atualizarLimitesUI();
            alert(`✅ Pneu removido com sucesso! Destino: ${destinoLabels[destino]}`);
        }

        // ============================================
        //  SELEÇÃO DE PEÇA PARA INSTALAÇÃO - SEM KM
        // ============================================
        let veiculoPecaId = null;
        let pecaSelecionadoId = null;

        function abrirModalSelecaoPeca(veiculoId) {
            const permissoes = getPermissoes(getCurrentUser());
            if (!permissoes.pecas && !isMaster()) {
                alert('🔒 Você não tem permissão para instalar peças.');
                return;
            }

            const veiculos = getVeiculos();
            const veiculo = veiculos.find(v => v.id === veiculoId);
            if (!veiculo) return;

            veiculoPecaId = veiculoId;

            const pecas = getPecas();
            const pecasDisponiveis = pecas.filter(p => p.status === 'disponivel' || !p.status);

            if (pecasDisponiveis.length === 0) {
                alert('Não há peças disponíveis no estoque para instalação.');
                return;
            }

            const modal = document.getElementById('modalSelecaoPeca');
            const lista = document.getElementById('listaPecasDisponiveis');
            const info = document.getElementById('infoPecaSelecao');

            info.textContent = `Selecione uma peça para instalar no veículo: ${veiculo.marca} ${veiculo.modelo} - ${veiculo.placa}`;

            lista.innerHTML = pecasDisponiveis.map(p => `
                <div class="item-disponivel" onclick="abrirModalInstalacaoPeca(${p.id})">
                    <div class="info">
                        <span class="nome">${p.nome}</span>
                        <span class="detalhes">${p.categoria} • R$ ${p.valor.toFixed(2)} • ${p.fornecedor || 'Sem fornecedor'}</span>
                    </div>
                    <span class="qtd">1</span>
                </div>
            `).join('');

            modal.classList.add('show');
        }

        function fecharModalSelecaoPeca() {
            document.getElementById('modalSelecaoPeca').classList.remove('show');
        }

        function abrirModalInstalacaoPeca(pecaId) {
            pecaSelecionadoId = pecaId;

            const veiculos = getVeiculos();
            const veiculo = veiculos.find(v => v.id === veiculoPecaId);
            if (!veiculo) {
                alert('Veículo não encontrado.');
                return;
            }
            veiculoAtual = veiculo;

            const pecas = getPecas();
            const peca = pecas.find(p => p.id === pecaId);
            if (!peca) {
                alert('Peça não encontrada.');
                return;
            }

            document.getElementById('infoInstalacaoPeca').textContent = 
                `Instalando peça: ${peca.nome} - Veículo: ${veiculo.marca} ${veiculo.modelo} - ${veiculo.placa}`;
            
            const hoje = new Date().toISOString().split('T')[0];
            document.getElementById('dataInstalacaoPeca').value = hoje;
            document.getElementById('posicaoInstalacaoPeca').value = '';

            fecharModalSelecaoPeca();
            document.getElementById('modalInstalacaoPeca').classList.add('show');
        }

        function fecharModalInstalacaoPeca() {
            document.getElementById('modalInstalacaoPeca').classList.remove('show');
            pecaSelecionadoId = null;
        }

        function confirmarInstalacaoPeca() {
            if (!veiculoAtual || !pecaSelecionadoId) {
                alert('Erro: Dados incompletos para instalação.');
                fecharModalInstalacaoPeca();
                return;
            }

            const dataInstalacao = document.getElementById('dataInstalacaoPeca').value;
            const posicao = document.getElementById('posicaoInstalacaoPeca').value.trim();

            if (!dataInstalacao) {
                alert('Por favor, informe a data da instalação.');
                return;
            }

            if (!posicao) {
                alert('Por favor, informe a posição/eixo onde a peça foi instalada.');
                return;
            }

            const veiculos = getVeiculos();
            const idx = veiculos.findIndex(v => v.id === veiculoAtual.id);
            if (idx !== -1) {
                veiculos[idx] = veiculoAtual;
                setVeiculos(veiculos);
            }

            const pecas = getPecas();
            const peca = pecas.find(p => p.id === pecaSelecionadoId);
            if (!peca) {
                alert('Peça não encontrada no estoque.');
                fecharModalInstalacaoPeca();
                return;
            }

            peca.status = 'instalado';
            peca.veiculoInstalado = veiculoAtual.placa;
            peca.veiculoId = veiculoAtual.id;
            peca.posicao = posicao;
            peca.dataInstalacao = dataInstalacao;

            if (!veiculoAtual.pecas) veiculoAtual.pecas = {};
            veiculoAtual.pecas[Date.now()] = pecaSelecionadoId;

            peca.historico = peca.historico || [];
            peca.historico.push({
                data: new Date().toLocaleString('pt-BR'),
                acao: 'Instalação',
                detalhes: `Instalado no veículo ${veiculoAtual.placa} - ${veiculoAtual.marca} ${veiculoAtual.modelo} em ${posicao} em ${dataInstalacao}`
            });

            setPecas(pecas);

            const idxVeiculo = veiculos.findIndex(v => v.id === veiculoAtual.id);
            if (idxVeiculo !== -1) {
                veiculos[idxVeiculo] = veiculoAtual;
                setVeiculos(veiculos);
            }

            fecharModalInstalacaoPeca();
            renderVeiculos();
            renderPecas();
            renderRelatorios();
            
            alert(`✅ Peça ${peca.nome} instalada com sucesso!`);
        }

        // ============================================
        //  REMOVER PEÇA INSTALADA
        // ============================================
        function removerPecaInstalada(pecaId) {
            if (!confirm('Tem certeza que deseja remover esta peça do veículo?')) return;

            const pecas = getPecas();
            const peca = pecas.find(p => p.id === pecaId);
            if (!peca) return;

            const veiculos = getVeiculos();
            const veiculo = veiculos.find(v => v.id === peca.veiculoId);
            if (veiculo && veiculo.pecas) {
                const chave = Object.keys(veiculo.pecas).find(k => veiculo.pecas[k] === pecaId);
                if (chave) delete veiculo.pecas[chave];
                setVeiculos(veiculos);
            }

            peca.status = 'disponivel';
            peca.veiculoInstalado = null;
            peca.veiculoId = null;
            peca.posicao = null;
            peca.dataInstalacao = null;
            peca.historico = peca.historico || [];
            peca.historico.push({
                data: new Date().toLocaleString('pt-BR'),
                acao: 'Remoção',
                detalhes: `Peça removida do veículo ${veiculo ? veiculo.placa : 'N/A'}`
            });

            setPecas(pecas);
            renderVeiculos();
            renderPecas();
            renderRelatorios();
            
            if (veiculo) {
                renderCaminhao(veiculo);
            }
            
            alert('✅ Peça removida com sucesso!');
        }

        // ============================================
        //  MANUTENÇÃO SIMPLIFICADA
        // ============================================
        function abrirModalManutencaoSimplificada() {
            if (!veiculoAtual) {
                alert('Selecione um veículo primeiro.');
                return;
            }

            const permissoes = getPermissoes(getCurrentUser());
            if (!permissoes.manutencao && !isMaster()) {
                alert('🔒 Você não tem permissão para adicionar serviços.');
                return;
            }

            document.getElementById('modalManutencaoSimplificadaSubtitle').textContent = 
                `Registre serviço para: ${veiculoAtual.marca} ${veiculoAtual.modelo} - ${veiculoAtual.placa}`;
            
            const hoje = new Date().toISOString().split('T')[0];
            document.getElementById('manutencaoSimpData').value = hoje;
            document.getElementById('manutencaoSimpKm').value = veiculoAtual.km;
            document.getElementById('manutencaoSimpKm').min = veiculoAtual.km;
            
            document.getElementById('manutencaoSimpTipo').value = '';
            document.getElementById('manutencaoSimpLocal').value = '';
            document.getElementById('manutencaoSimpValor').value = '';
            document.getElementById('manutencaoSimpObs').value = '';
            
            document.getElementById('modalManutencaoSimplificada').classList.add('show');
        }

        function fecharModalManutencaoSimplificada() {
            document.getElementById('modalManutencaoSimplificada').classList.remove('show');
        }

        function confirmarManutencaoSimplificada() {
            const tipo = document.getElementById('manutencaoSimpTipo').value;
            const data = document.getElementById('manutencaoSimpData').value;
            const km = parseInt(document.getElementById('manutencaoSimpKm').value);
            const local = document.getElementById('manutencaoSimpLocal').value.trim();
            const valor = parseFloat(document.getElementById('manutencaoSimpValor').value) || 0;
            const obs = document.getElementById('manutencaoSimpObs').value.trim();

            if (!tipo) {
                alert('Por favor, selecione o tipo de serviço.');
                return;
            }

            if (!data) {
                alert('Por favor, informe a data do serviço.');
                return;
            }

            if (!km || km < 0) {
                alert('Por favor, informe uma quilometragem válida.');
                return;
            }

            if (km < veiculoAtual.km) {
                alert('A quilometragem não pode ser menor que a atual do veículo.');
                return;
            }

            if (!local) {
                alert('Por favor, informe o local/ oficina.');
                return;
            }

            if (!valor || valor <= 0) {
                alert('Por favor, informe o valor do serviço.');
                return;
            }

            const veiculos = getVeiculos();
            const idx = veiculos.findIndex(v => v.id === veiculoAtual.id);
            if (idx !== -1) {
                veiculos[idx].km = km;
                if (!veiculos[idx].servicos) veiculos[idx].servicos = [];
                veiculos[idx].servicos.push({
                    tipo: tipo,
                    data: data,
                    km: km,
                    local: local,
                    valor: valor,
                    obs: obs,
                    dataRegistro: new Date().toLocaleString('pt-BR')
                });
                setVeiculos(veiculos);
                veiculoAtual = veiculos[idx];
            }

            fecharModalManutencaoSimplificada();
            renderManutencao();
            renderVeiculos();
            renderRelatorios();
            
            if (veiculoAtual) {
                renderCaminhao(veiculoAtual);
                renderServicosAlinhamento(veiculoAtual);
            }
            
            alert('✅ Serviço registrado com sucesso!');
        }

        // ============================================
        //  COMBINAR VEÍCULOS
        // ============================================
        function abrirModalCombinar() {
            if (!veiculoAtual) {
                alert('Selecione um veículo primeiro.');
                return;
            }

            if (veiculoAtual.combinadoCom) {
                alert('Este veículo já está combinado com outro. Desvincule primeiro.');
                return;
            }

            const veiculos = getVeiculos();
            const disponiveis = veiculos.filter(v => 
                v.id !== veiculoAtual.id && 
                !v.combinadoCom && 
                v.status === 'ativo'
            );

            if (disponiveis.length === 0) {
                alert('Não há veículos disponíveis para combinar.');
                return;
            }

            const select = document.getElementById('combinarVeiculoSelect');
            select.innerHTML = '<option value="">Selecione...</option>';
            disponiveis.forEach(v => {
                const tipoLabel = {
                    'cavalo_3_eixos': 'Cavalo - 3 Eixos',
                    '4_eixos': '4 Eixos',
                    'carreta': 'Carreta'
                } [v.tipo] || v.tipo;
                select.innerHTML += `<option value="${v.id}">${v.placa} - ${v.marca} ${v.modelo} (${tipoLabel})</option>`;
            });

            document.getElementById('modalCombinar').classList.add('show');
        }

        function fecharModalCombinar() {
            document.getElementById('modalCombinar').classList.remove('show');
        }

        function confirmarCombinar() {
            const veiculoId = parseInt(document.getElementById('combinarVeiculoSelect').value);
            if (!veiculoId) {
                alert('Selecione um veículo para combinar.');
                return;
            }

            const veiculos = getVeiculos();
            const veiculo1 = veiculos.find(v => v.id === veiculoAtual.id);
            const veiculo2 = veiculos.find(v => v.id === veiculoId);

            if (!veiculo1 || !veiculo2) {
                alert('Veículo não encontrado.');
                return;
            }

            const tipos = [veiculo1.tipo, veiculo2.tipo];
            const temCavalo = tipos.includes('cavalo_3_eixos');
            const temCarreta = tipos.includes('carreta');
            
            if (!(temCavalo && temCarreta)) {
                alert('Para combinar, um veículo deve ser do tipo "Cavalo - 3 Eixos" e o outro "Carreta".');
                return;
            }

            let cavalo, carreta;
            if (veiculo1.tipo === 'cavalo_3_eixos') {
                cavalo = veiculo1;
                carreta = veiculo2;
            } else {
                cavalo = veiculo2;
                carreta = veiculo1;
            }

            cavalo.combinadoCom = carreta.id;
            cavalo.combinadoTipo = 'cavalo';
            carreta.combinadoCom = cavalo.id;
            carreta.combinadoTipo = 'carreta';

            setVeiculos(veiculos);
            fecharModalCombinar();
            renderVeiculos();
            renderManutencao();
            
            alert(`✅ Veículos combinados com sucesso! Cavalo: ${cavalo.placa} + Carreta: ${carreta.placa}`);
        }

        function desvincularVeiculos(id) {
            if (!confirm('Deseja desvincular este veículo do combinado?')) return;

            const veiculos = getVeiculos();
            const veiculo = veiculos.find(v => v.id === id);
            if (!veiculo) return;

            const combinado = veiculos.find(v => v.id === veiculo.combinadoCom);
            if (combinado) {
                combinado.combinadoCom = null;
                combinado.combinadoTipo = null;
            }
            veiculo.combinadoCom = null;
            veiculo.combinadoTipo = null;

            setVeiculos(veiculos);
            fecharModalCaminhao();
            renderVeiculos();
            renderManutencao();
            
            alert('✅ Veículos desvinculados com sucesso!');
        }

        // ============================================
        //  MASTER CONTROL
        // ============================================
        function renderMaster() {
            if (!isMaster()) {
                document.getElementById('masterGrid').innerHTML = '<div class="empty-state"><p>🔒 Acesso restrito ao administrador.</p></div>';
                return;
            }

            const users = getUsers();
            const filtroEmpresa = document.getElementById('filtroMasterEmpresa')?.value.toLowerCase() || '';
            const filtroStatus = document.getElementById('filtroMasterStatus')?.value || '';

            const usersFiltrados = users.filter(u => {
                const matchEmpresa = (u.company || u.companyName || '').toLowerCase().includes(filtroEmpresa);
                const matchStatus = !filtroStatus || u.status === filtroStatus;
                return matchEmpresa && matchStatus;
            });

            const grid = document.getElementById('masterGrid');

            if (usersFiltrados.length === 0) {
                grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><p>Nenhuma empresa encontrada.</p></div>';
                return;
            }

            let html = '';
            usersFiltrados.forEach(u => {
                const pneus = getPneus();
                const veiculos = getVeiculos();
                const pneusCount = pneus.length;
                const veiculosCount = veiculos.length;
                
                const statusBadge = u.status === 'aprovado' ? 'badge-ativo' : 
                                   u.status === 'pendente' ? 'badge-meia' : 'badge-inativo';
                const statusLabel = u.status === 'aprovado' ? '✅ Aprovado' :
                                   u.status === 'pendente' ? '⏳ Pendente' : '❌ Bloqueado';

                const permissoes = u.permissoes || {};
                const pneusLimite = permissoes.pneusLimite || 10;
                const veiculosLimite = permissoes.veiculosLimite || 1;

                html += `
                    <div class="master-card">
                        <div class="empresa-nome">${u.company || u.companyName || u.name}</div>
                        <div class="empresa-info">📧 ${u.email}</div>
                        <div class="empresa-info">👤 ${u.name}</div>
                        <div class="empresa-info">📅 ${new Date(u.dataCadastro).toLocaleDateString('pt-BR')}</div>
                        <div class="empresa-status">
                            <span class="badge ${statusBadge}">${statusLabel}</span>
                            ${u.isMaster ? '<span class="badge badge-ativo">👑 Master</span>' : ''}
                            <span style="font-size:12px; color:#666;">Pneus: ${pneusCount}/${pneusLimite} | Veículos: ${veiculosCount}/${veiculosLimite}</span>
                        </div>
                        <div class="empresa-actions">
                            ${!u.isMaster ? `
                                <button class="btn-success" onclick="aprovarEmpresa(${u.id})" title="Aprovar">✅</button>
                                <button class="btn-warning" onclick="bloquearEmpresa(${u.id})" title="Bloquear">🚫</button>
                                <button class="btn-info" onclick="editarPermissoes(${u.id})" title="Editar Permissões">📝</button>
                                <button class="btn-master" onclick="promoverMaster(${u.id})" title="Promover a Master">👑</button>
                            ` : '<span style="color:#999; font-size:12px;">👑 Conta Master</span>'}
                            <button class="btn-danger" onclick="excluirEmpresa(${u.id})" title="Excluir Conta">🗑️</button>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;
        }

        function limparFiltrosMaster() {
            document.getElementById('filtroMasterEmpresa').value = '';
            document.getElementById('filtroMasterStatus').value = '';
            renderMaster();
        }

        function aprovarEmpresa(userId) {
            if (!confirm('Confirmar aprovação desta empresa?')) return;
            const users = getUsers();
            const idx = users.findIndex(u => u.id === userId);
            if (idx !== -1) {
                users[idx].status = 'aprovado';
                setUsers(users);
                renderMaster();
                alert('✅ Empresa aprovada com sucesso!');
            }
        }

        function bloquearEmpresa(userId) {
            if (!confirm('Bloquear esta empresa?')) return;
            const users = getUsers();
            const idx = users.findIndex(u => u.id === userId);
            if (idx !== -1) {
                users[idx].status = 'bloqueado';
                setUsers(users);
                renderMaster();
                alert('🚫 Empresa bloqueada!');
            }
        }

        function editarPermissoes(userId) {
            const users = getUsers();
            const user = users.find(u => u.id === userId);
            if (!user) return;

            const permissoes = user.permissoes || {};
            const pneusLimite = parseInt(prompt(`Limite de Pneus (atual: ${permissoes.pneusLimite || 10})`, permissoes.pneusLimite || 10));
            if (isNaN(pneusLimite) || pneusLimite < 0) return;

            const veiculosLimite = parseInt(prompt(`Limite de Veículos (atual: ${permissoes.veiculosLimite || 1})`, permissoes.veiculosLimite || 1));
            if (isNaN(veiculosLimite) || veiculosLimite < 0) return;

            const pecas = confirm('Permitir acesso a Estoque de Peças? (OK = Sim, Cancelar = Não)');
            const manutencao = confirm('Permitir acesso a Manutenção? (OK = Sim, Cancelar = Não)');
            const motoristas = confirm('Permitir acesso a Motoristas? (OK = Sim, Cancelar = Não)');
            const descartados = confirm('Permitir acesso a Descartados? (OK = Sim, Cancelar = Não)');
            const relatorios = confirm('Permitir acesso a Relatórios? (OK = Sim, Cancelar = Não)');

            const idx = users.findIndex(u => u.id === userId);
            if (idx !== -1) {
                users[idx].permissoes = {
                    pneusLimite: pneusLimite,
                    veiculosLimite: veiculosLimite,
                    pecas: pecas,
                    manutencao: manutencao,
                    motoristas: motoristas,
                    descartados: descartados,
                    relatorios: relatorios
                };
                setUsers(users);
                renderMaster();
                alert('✅ Permissões atualizadas com sucesso!');
            }
        }

        function promoverMaster(userId) {
            const senha = prompt('Digite a senha master para promover este usuário:');
            if (senha !== getMasterPassword()) {
                alert('❌ Senha incorreta!');
                return;
            }
            if (!confirm('Tem certeza que deseja promover este usuário a Master?')) return;
            
            if (promoverParaMaster(userId)) {
                renderMaster();
                alert('✅ Usuário promovido a Master com sucesso!');
            }
        }

        function excluirEmpresa(userId) {
            const senha = prompt('Digite a senha master para excluir esta conta:');
            if (senha !== getMasterPassword()) {
                alert('❌ Senha incorreta!');
                return;
            }
            if (!confirm('Tem certeza que deseja excluir esta conta permanentemente?')) return;

            let users = getUsers();
            users = users.filter(u => u.id !== userId);
            setUsers(users);
            renderMaster();
            alert('✅ Conta excluída com sucesso!');
        }

        function abrirPDF(html, nomeArquivo) {
            const win = window.open('', '_blank', 'width=1000,height=800');
            if (!win) {
                alert('Por favor, permita pop-ups para gerar o PDF.');
                return;
            }
            win.document.write(html);
            win.document.close();
            win.focus();
            win.print();
        }

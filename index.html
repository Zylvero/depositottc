    <style>

    <!-- ... (mantenha o resto do HTML) ... -->

    <script>
        // ============================================
        //  BANCO DE DADOS (mantido)
        // ============================================
        function getCurrentUserId() {
            const user = getCurrentUser();
            return user ? user.id : 'default';
        }

        function getUsers() {
            return JSON.parse(localStorage.getItem('estoque_users')) || [];
        }

        function setUsers(users) {
            localStorage.setItem('estoque_users', JSON.stringify(users));
        }

        function getPneus() {
            const userId = getCurrentUserId();
            return JSON.parse(localStorage.getItem(`estoque_pneus_${userId}`)) || [];
        }

        function setPneus(pneus) {
            const userId = getCurrentUserId();
            localStorage.setItem(`estoque_pneus_${userId}`, JSON.stringify(pneus));
        }

        function getPecas() {
            const userId = getCurrentUserId();
            return JSON.parse(localStorage.getItem(`estoque_pecas_${userId}`)) || [];
        }

        function setPecas(pecas) {
            const userId = getCurrentUserId();
            localStorage.setItem(`estoque_pecas_${userId}`, JSON.stringify(pecas));
        }

        function getVeiculos() {
            const userId = getCurrentUserId();
            return JSON.parse(localStorage.getItem(`estoque_veiculos_${userId}`)) || [];
        }

        function setVeiculos(veiculos) {
            const userId = getCurrentUserId();
            localStorage.setItem(`estoque_veiculos_${userId}`, JSON.stringify(veiculos));
        }

        function getDescartados() {
            const userId = getCurrentUserId();
            return JSON.parse(localStorage.getItem(`estoque_descartados_${userId}`)) || [];
        }

        function setDescartados(descartados) {
            const userId = getCurrentUserId();
            localStorage.setItem(`estoque_descartados_${userId}`, JSON.stringify(descartados));
        }

        function getManutencoes() {
            const userId = getCurrentUserId();
            return JSON.parse(localStorage.getItem(`estoque_manutencoes_${userId}`)) || [];
        }

        function setManutencoes(manutencoes) {
            const userId = getCurrentUserId();
            localStorage.setItem(`estoque_manutencoes_${userId}`, JSON.stringify(manutencoes));
        }

        function getMotoristas() {
            const userId = getCurrentUserId();
            return JSON.parse(localStorage.getItem(`estoque_motoristas_${userId}`)) || [];
        }

        function setMotoristas(motoristas) {
            const userId = getCurrentUserId();
            localStorage.setItem(`estoque_motoristas_${userId}`, JSON.stringify(motoristas));
        }

        function getRotas() {
            const userId = getCurrentUserId();
            return JSON.parse(localStorage.getItem(`estoque_rotas_${userId}`)) || [];
        }

        function setRotas(rotas) {
            const userId = getCurrentUserId();
            localStorage.setItem(`estoque_rotas_${userId}`, JSON.stringify(rotas));
        }

        function getCurrentUser() {
            return JSON.parse(localStorage.getItem('estoque_current_user'));
        }

        function setCurrentUser(user) {
            localStorage.setItem('estoque_current_user', JSON.stringify(user));
        }

        function clearCurrentUser() {
            localStorage.removeItem('estoque_current_user');
        }

        // ============================================
        //  RECUPERAÇÃO DE SENHA
        // ============================================
        function toggleRecuperacao() {
            const container = document.getElementById('recuperacaoContainer');
            container.classList.toggle('show');
            if (!container.classList.contains('show')) {
                document.getElementById('recuperacaoMsg').style.display = 'none';
            }
        }

        function recuperarSenha() {
            const email = document.getElementById('recuperacaoEmail').value.trim();
            const msg = document.getElementById('recuperacaoMsg');
            
            if (!email) {
                msg.style.color = '#c62828';
                msg.textContent = 'Por favor, digite seu e-mail.';
                msg.style.display = 'block';
                return;
            }

            const users = getUsers();
            const user = users.find(u => u.email === email);
            
            if (!user) {
                msg.style.color = '#c62828';
                msg.textContent = '❌ E-mail não encontrado. Verifique e tente novamente.';
                msg.style.display = 'block';
                return;
            }

            const codigo = Math.random().toString(36).substring(2, 8).toUpperCase();
            user.codigoRecuperacao = codigo;
            user.codigoRecuperacaoData = new Date().toISOString();
            setUsers(users);

            msg.style.color = '#2e7d32';
            msg.innerHTML = `
                ✅ Um link de recuperação foi enviado para <strong>${email}</strong>.<br>
                <span style="font-size:12px; color:#666;">Código de verificação: <strong>${codigo}</strong> (simulado)</span><br>
                <span style="font-size:12px; color:#666;">Verifique seu e-mail ou entre em contato com o suporte.</span>
            `;
            msg.style.display = 'block';

            setTimeout(() => {
                const novaSenha = prompt(`Digite uma nova senha para ${email} (código: ${codigo})`);
                if (novaSenha && novaSenha.length >= 6) {
                    const usersAtualizados = getUsers();
                    const idx = usersAtualizados.findIndex(u => u.id === user.id);
                    if (idx !== -1) {
                        usersAtualizados[idx].password = novaSenha;
                        usersAtualizados[idx].codigoRecuperacao = null;
                        setUsers(usersAtualizados);
                        msg.style.color = '#2e7d32';
                        msg.innerHTML = '✅ Senha redefinida com sucesso! Faça login com sua nova senha.';
                        document.getElementById('recuperacaoEmail').value = '';
                    }
                } else if (novaSenha !== null) {
                    alert('❌ A senha deve ter pelo menos 6 caracteres.');
                }
            }, 1500);
        }

        // ============================================
        //  MASTER CONTROL
        // ============================================
        function isMaster() {
            const user = getCurrentUser();
            return user && user.isMaster === true;
        }

        function getMasterPassword() {
            return 'Master@2024';
        }

        function promoverParaMaster(userId) {
            const users = getUsers();
            const idx = users.findIndex(u => u.id === userId);
            if (idx !== -1) {
                users[idx].isMaster = true;
                setUsers(users);
                if (getCurrentUser() && getCurrentUser().id === userId) {
                    setCurrentUser(users[idx]);
                }
                return true;
            }
            return false;
        }

        function alterarPermissao(userId, permissao, valor) {
            const users = getUsers();
            const idx = users.findIndex(u => u.id === userId);
            if (idx !== -1) {
                if (!users[idx].permissoes) users[idx].permissoes = {};
                users[idx].permissoes[permissao] = valor;
                setUsers(users);
                if (getCurrentUser() && getCurrentUser().id === userId) {
                    setCurrentUser(users[idx]);
                }
                return true;
            }
            return false;
        }

        function getPermissoes(user) {
            if (!user) return {};
            if (user.isMaster) {
                return {
                    pneus: { limite: Infinity },
                    veiculos: { limite: Infinity },
                    pecas: true,
                    manutencao: true,
                    motoristas: true,
                    descartados: true,
                    relatorios: true
                };
            }
            const permissoes = user.permissoes || {};
            return {
                pneus: { limite: permissoes.pneusLimite || 10 },
                veiculos: { limite: permissoes.veiculosLimite || 1 },
                pecas: permissoes.pecas || false,
                manutencao: permissoes.manutencao || false,
                motoristas: permissoes.motoristas || false,
                descartados: permissoes.descartados || false,
                relatorios: permissoes.relatorios || false
            };
        }

        function verificarLimitePneus() {
            const user = getCurrentUser();
            if (!user) return true;
            if (isMaster()) return true;
            const permissoes = getPermissoes(user);
            const pneus = getPneus();
            return pneus.length < permissoes.pneus.limite;
        }

        function verificarLimiteVeiculos() {
            const user = getCurrentUser();
            if (!user) return true;
            if (isMaster()) return true;
            const permissoes = getPermissoes(user);
            const veiculos = getVeiculos();
            return veiculos.length < permissoes.veiculos.limite;
        }

        function atualizarLimitesUI() {
            const user = getCurrentUser();
            if (!user) return;
            
            const permissoes = getPermissoes(user);
            
            const pneus = getPneus();
            const pneuLimitWarning = document.getElementById('pneuLimitWarning');
            const pneuLimitCount = document.getElementById('pneuLimitCount');
            const pneuLimitCurrent = document.getElementById('pneuLimitCurrent');
            
            if (!isMaster() && permissoes.pneus.limite < Infinity) {
                pneuLimitWarning.style.display = 'block';
                pneuLimitCount.textContent = permissoes.pneus.limite;
                pneuLimitCurrent.textContent = `Atualmente: ${pneus.length} pneu(s) cadastrado(s)`;
                if (pneus.length >= permissoes.pneus.limite) {
                    pneuLimitWarning.style.borderLeftColor = '#c62828';
                    pneuLimitWarning.style.background = '#ffebee';
                } else {
                    pneuLimitWarning.style.borderLeftColor = '#f57c00';
                    pneuLimitWarning.style.background = '#fff3e0';
                }
            } else {
                pneuLimitWarning.style.display = 'none';
            }

            const veiculos = getVeiculos();
            const veiculoLimitWarning = document.getElementById('veiculoLimitWarning');
            const veiculoLimitCount = document.getElementById('veiculoLimitCount');
            const veiculoLimitCurrent = document.getElementById('veiculoLimitCurrent');
            
            if (!isMaster() && permissoes.veiculos.limite < Infinity) {
                veiculoLimitWarning.style.display = 'block';
                veiculoLimitCount.textContent = permissoes.veiculos.limite;
                veiculoLimitCurrent.textContent = `Atualmente: ${veiculos.length} veículo(s) cadastrado(s)`;
                if (veiculos.length >= permissoes.veiculos.limite) {
                    veiculoLimitWarning.style.borderLeftColor = '#c62828';
                    veiculoLimitWarning.style.background = '#ffebee';
                } else {
                    veiculoLimitWarning.style.borderLeftColor = '#f57c00';
                    veiculoLimitWarning.style.background = '#fff3e0';
                }
            } else {
                veiculoLimitWarning.style.display = 'none';
            }

            const bloqueadas = {
                pecas: !permissoes.pecas && !isMaster(),
                veiculos: !permissoes.veiculos.limite && !isMaster(),
                manutencao: !permissoes.manutencao && !isMaster(),
                motoristas: !permissoes.motoristas && !isMaster(),
                descartados: !permissoes.descartados && !isMaster(),
                relatorios: !permissoes.relatorios && !isMaster()
            };

            document.getElementById('pecasContent').style.display = bloqueadas.pecas ? 'none' : 'block';
            document.getElementById('pecasBlocked').style.display = bloqueadas.pecas ? 'block' : 'none';
            
            document.getElementById('veiculosContent').style.display = bloqueadas.veiculos ? 'none' : 'block';
            document.getElementById('veiculosBlocked').style.display = bloqueadas.veiculos ? 'block' : 'none';
            
            document.getElementById('manutencaoContent').style.display = bloqueadas.manutencao ? 'none' : 'block';
            document.getElementById('manutencaoBlocked').style.display = bloqueadas.manutencao ? 'block' : 'none';
            
            document.getElementById('motoristasContent').style.display = bloqueadas.motoristas ? 'none' : 'block';
            document.getElementById('motoristasBlocked').style.display = bloqueadas.motoristas ? 'block' : 'none';
            
            document.getElementById('descartadosContent').style.display = bloqueadas.descartados ? 'none' : 'block';
            document.getElementById('descartadosBlocked').style.display = bloqueadas.descartados ? 'block' : 'none';
            
            document.getElementById('relatoriosContent').style.display = bloqueadas.relatorios ? 'none' : 'block';
            document.getElementById('relatoriosBlocked').style.display = bloqueadas.relatorios ? 'block' : 'none';

            const tabPecas = document.getElementById('tabBtnPecas');
            const tabVeiculos = document.getElementById('tabBtnVeiculos');
            const tabManutencao = document.getElementById('tabBtnManutencao');
            const tabMotoristas = document.getElementById('tabBtnMotoristas');
            const tabDescartados = document.getElementById('tabBtnDescartados');
            const tabRelatorios = document.getElementById('tabBtnRelatorios');

            tabPecas.classList.toggle('blocked', bloqueadas.pecas);
            tabVeiculos.classList.toggle('blocked', bloqueadas.veiculos);
            tabManutencao.classList.toggle('blocked', bloqueadas.manutencao);
            tabMotoristas.classList.toggle('blocked', bloqueadas.motoristas);
            tabDescartados.classList.toggle('blocked', bloqueadas.descartados);
            tabRelatorios.classList.toggle('blocked', bloqueadas.relatorios);
        }

        // ============================================
        //  AUTH
        // ============================================
        function switchAuthTab(tab) {
            document.querySelectorAll('.auth-tabs button').forEach(b => b.classList.remove('active'));
            document.querySelector(`.auth-tabs button[data-tab="${tab}"]`).classList.add('active');
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            if (tab === 'login') {
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.getElementById('registerForm').classList.add('active');
            }
            document.getElementById('loginError').classList.remove('show');
            document.getElementById('registerError').classList.remove('show');
            document.getElementById('recuperacaoContainer').classList.remove('show');
            document.getElementById('recuperacaoMsg').style.display = 'none';
        }

        function register(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const company = document.getElementById('regCompany').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;

            const users = getUsers();
            if (users.find(u => u.email === email)) {
                const err = document.getElementById('registerError');
                err.textContent = 'Este e-mail já está cadastrado.';
                err.classList.add('show');
                return;
            }

            const newUser = {
                id: Date.now(),
                name,
                company,
                email,
                password,
                companyName: company,
                isMaster: false,
                permissoes: {
                    pneusLimite: 10,
                    veiculosLimite: 1,
                    pecas: false,
                    manutencao: false,
                    motoristas: false,
                    descartados: false,
                    relatorios: false
                },
                status: 'pendente',
                dataCadastro: new Date().toISOString()
            };
            
            if (email.toLowerCase() === "henrique_iijima@hotmail.com") {
                newUser.isMaster = true;
                newUser.status = 'aprovado';
                console.log('👑 Usuário Master criado!');
            }
            
            users.push(newUser);
            setUsers(users);

            const userId = newUser.id;
            localStorage.setItem(`estoque_pneus_${userId}`, JSON.stringify([]));
            localStorage.setItem(`estoque_pecas_${userId}`, JSON.stringify([]));
            localStorage.setItem(`estoque_veiculos_${userId}`, JSON.stringify([]));
            localStorage.setItem(`estoque_descartados_${userId}`, JSON.stringify([]));
            localStorage.setItem(`estoque_manutencoes_${userId}`, JSON.stringify([]));
            localStorage.setItem(`estoque_motoristas_${userId}`, JSON.stringify([]));
            localStorage.setItem(`estoque_rotas_${userId}`, JSON.stringify([]));

            setCurrentUser(newUser);
            document.getElementById('registerError').classList.remove('show');
            enterApp();
        }

        function login(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            let users = getUsers();
            let user = users.find(u => u.email === email && u.password === password);

            if (!user) {
                const err = document.getElementById('loginError');
                err.textContent = 'E-mail ou senha incorretos.';
                err.classList.add('show');
                return;
            }

            if (email.toLowerCase() === "henrique_iijima@hotmail.com") {
                const idx = users.findIndex(u => u.id === user.id);
                if (idx !== -1) {
                    users[idx].isMaster = true;
                    users[idx].status = 'aprovado';
                    user.isMaster = true;
                    user.status = 'aprovado';
                    setUsers(users);
                    console.log('👑 Usuário Master promovido automaticamente!');
                }
            }

            if (user.status === 'bloqueado') {
                const err = document.getElementById('loginError');
                err.textContent = '❌ Esta conta está bloqueada. Entre em contato com o administrador.';
                err.classList.add('show');
                return;
            }

            setCurrentUser(user);
            document.getElementById('loginError').classList.remove('show');
            enterApp();
        }

        function logout() {
            clearCurrentUser();
            document.getElementById('appContainer').classList.remove('show');
            document.getElementById('mainHeader').style.display = 'none';
            document.getElementById('authContainer').style.display = 'block';
            document.getElementById('loginForm').reset();
            document.getElementById('registerForm').reset();
            switchAuthTab('login');
        }

        function enterApp() {
            const user = getCurrentUser();
            if (!user) return;

            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('mainHeader').style.display = 'flex';
            document.getElementById('appContainer').classList.add('show');

            const companyEl = document.getElementById('companyName');
            companyEl.textContent = user.companyName || user.company || 'Minha Empresa';
            companyEl.dataset.baseName = user.companyName || user.company || 'Minha Empresa';

            let displayName = `👤 ${user.name}`;
            if (user.isMaster) {
                displayName += ' 👑';
                document.getElementById('masterBadge').style.display = 'inline';
            } else {
                document.getElementById('masterBadge').style.display = 'none';
            }
            document.getElementById('userDisplay').textContent = displayName;

            document.getElementById('tabBtnMaster').style.display = user.isMaster ? 'inline-block' : 'none';

            atualizarSelectMotoristas();
            atualizarLimitesUI();

            renderEstoque();
            renderPecas();
            renderVeiculos();
            renderManutencao();
            renderMotoristas();
            renderDescartados();
            renderMaster();
            atualizarFiltrosRelatorios();
            renderRelatorios();
            switchTab('tab-cadastro');
        }

        // ============================================
        //  FUNÇÕES DE ATUALIZAÇÃO DE SELECTS
        // ============================================
        function atualizarSelectMotoristas() {
            const motoristas = getMotoristas();
            const select = document.getElementById('veiculoMotorista');
            select.innerHTML = '<option value="">Selecione um motorista (opcional)...</option>';
            motoristas.forEach(m => {
                select.innerHTML += `<option value="${m.nome}">${m.nome}</option>`;
            });
        }

        function switchTab(tabId) {
            if (tabId !== 'tab-cadastro' && tabId !== 'tab-estoque' && tabId !== 'tab-master') {
                const user = getCurrentUser();
                if (!user) return;
                const permissoes = getPermissoes(user);
                const bloqueadas = {
                    'tab-pecas': !permissoes.pecas && !isMaster(),
                    'tab-veiculos': !permissoes.veiculos.limite && !isMaster(),
                    'tab-manutencao': !permissoes.manutencao && !isMaster(),
                    'tab-motoristas': !permissoes.motoristas && !isMaster(),
                    'tab-descartados': !permissoes.descartados && !isMaster(),
                    'tab-relatorios': !permissoes.relatorios && !isMaster()
                };
                if (bloqueadas[tabId]) {
                    alert('🔒 Esta funcionalidade está bloqueada para sua conta. Entre em contato com o administrador.');
                    return;
                }
            }

            document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
            const tabBtn = document.querySelector(`.tabs button[data-tab="${tabId}"]`);
            if (tabBtn) tabBtn.classList.add('active');
            
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');

            if (tabId === 'tab-estoque') renderEstoque();
            if (tabId === 'tab-pecas') renderPecas();
            if (tabId === 'tab-veiculos') renderVeiculos();
            if (tabId === 'tab-manutencao') renderManutencao();
            if (tabId === 'tab-motoristas') renderMotoristas();
            if (tabId === 'tab-descartados') renderDescartados();
            if (tabId === 'tab-relatorios') {
                atualizarFiltrosRelatorios();
                renderRelatorios();
            }
            if (tabId === 'tab-master') renderMaster();
        }

        // ============================================
        //  FORMULÁRIO PNEU
        // ============================================
        function handlePneuSelect() {
            const select = document.getElementById('pneuNomeSelect');
            const outros = document.getElementById('pneuNomeOutros');
            if (select.value === 'outros') {
                outros.classList.remove('hidden');
                outros.required = true;
                outros.focus();
            } else {
                outros.classList.add('hidden');
                outros.required = false;
                outros.value = '';
            }
        }

        function handleTamanhoSelect() {
            const select = document.getElementById('pneuTamanhoSelect');
            const outros = document.getElementById('pneuTamanhoOutros');
            if (select.value === 'outros') {
                outros.classList.remove('hidden');
                outros.required = true;
                outros.focus();
            } else {
                outros.classList.add('hidden');
                outros.required = false;
                outros.value = '';
            }
        }

        // ============================================
        //  CADASTRAR PNEU
        // ============================================
        let pneusParaCadastrar = [];

        function cadastrarPneu(e) {
            e.preventDefault();

            if (!verificarLimitePneus()) {
                alert('⚠️ Limite de pneus atingido! Sua conta permite apenas ' + getPermissoes(getCurrentUser()).pneus.limite + ' pneus no estoque.');
                return;
            }

            let nome = document.getElementById('pneuNomeSelect').value;
            if (nome === 'outros') {
                nome = document.getElementById('pneuNomeOutros').value.trim();
            }
            if (!nome) {
                alert('Por favor, selecione ou digite o nome do pneu.');
                return;
            }

            let tamanho = document.getElementById('pneuTamanhoSelect').value;
            if (tamanho === 'outros') {
                tamanho = document.getElementById('pneuTamanhoOutros').value.trim();
            }
            if (!tamanho) {
                alert('Por favor, selecione ou digite o tamanho do pneu.');
                return;
            }

            const dot = document.getElementById('pneuDot').value.trim();
            const tipo = document.getElementById('pneuTipo').value;
            const situacao = document.getElementById('pneuSituacao').value;
            const valor = parseFloat(document.getElementById('pneuValor').value) || 0;
            const outrosValores = parseFloat(document.getElementById('pneuOutrosValores').value) || 0;
            const quantidade = parseInt(document.getElementById('pneuQuantidade').value) || 1;
            const dataEntrada = document.getElementById('pneuDataEntrada').value || new Date().toISOString().split('T')[0];

            const pneus = getPneus();
            const permissoes = getPermissoes(getCurrentUser());
            if (!isMaster() && pneus.length + quantidade > permissoes.pneus.limite) {
                alert(`⚠️ Limite de pneus excedido! Você pode ter no máximo ${permissoes.pneus.limite} pneus. Atualmente: ${pneus.length}`);
                return;
            }

            if (quantidade === 1) {
                const pneu = criarPneu(nome, dot, tamanho, tipo, situacao, valor, outrosValores, dataEntrada);
                pneus.push(pneu);
                setPneus(pneus);
                
                limparFormPneu();
                renderEstoque();
                atualizarLimitesUI();
                switchTab('tab-estoque');
                alert('✅ 1 pneu cadastrado com sucesso!');
                return;
            }

            pneusParaCadastrar = [];
            for (let i = 0; i < quantidade; i++) {
                pneusParaCadastrar.push({
                    index: i + 1,
                    nome: nome,
                    dot: i === 0 ? dot : '',
                    tamanho: tamanho,
                    tipo: tipo,
                    situacao: situacao,
                    valor: valor,
                    outrosValores: outrosValores,
                    dataEntrada: dataEntrada
                });
            }

            abrirModalCadastroMultiplo();
        }

        function criarPneu(nome, dot, tamanho, tipo, situacao, valor, outrosValores, dataEntrada) {
            return {
                id: Date.now() + Math.random() * 1000,
                nome: nome,
                dot: dot || 'Não informado',
                tamanho: tamanho,
                tipo: tipo,
                situacao: situacao,
                valor: valor,
                outrosValores: outrosValores || 0,
                valorRecapagem: 0,
                valorVulcanizacao: 0,
                valorRodizio: 0,
                valorRemendo: 0,
                status: 'disponivel',
                veiculoInstalado: null,
                veiculoId: null,
                posicao: null,
                kmTotal: 0,
                kmInstalacao: null,
                kmRemocao: null,
                dataEntrada: dataEntrada || new Date().toISOString().split('T')[0],
                dataCadastro: new Date().toLocaleDateString('pt-BR'),
                faixas: { f1: 0, f2: 0, f3: 0, f4: 0 },
                contadorRecapagens: 0,
                contadorVulcanizacoes: 0,
                tipoRecapagem: null,
                historico: [{
                    data: new Date().toLocaleString('pt-BR'),
                    acao: 'Cadastro',
                    detalhes: `Pneu cadastrado como ${situacao}`
                }],
                ultimaMedicaoKm: 0,
                ultimaMedicaoData: null,
                historicoMedicoes: []
            };
        }

        function limparFormPneu() {
            document.getElementById('pneuDot').value = '';
            document.getElementById('pneuValor').value = '0';
            document.getElementById('pneuOutrosValores').value = '0';
            document.getElementById('pneuQuantidade').value = '1';
            document.getElementById('pneuNomeSelect').value = '';
            document.getElementById('pneuTamanhoSelect').value = '';
            document.getElementById('pneuTipo').value = 'liso';
            document.getElementById('pneuSituacao').value = 'novo';
            document.getElementById('pneuDataEntrada').value = '';
            document.getElementById('pneuNomeOutros').classList.add('hidden');
            document.getElementById('pneuNomeOutros').value = '';
            document.getElementById('pneuTamanhoOutros').classList.add('hidden');
            document.getElementById('pneuTamanhoOutros').value = '';
        }

        //  CADASTRO MÚLTIPLO
        // ============================================

            const subtitle = document.getElementById('modalMultiploSubtitle');
            
            subtitle.textContent = `Preencha o DOT/Fogo de cada um dos ${pneusParaCadastrar.length} pneus`;
            
            let html = `
                <div style="display:grid; grid-template-columns: auto 1fr auto; gap:10px; font-weight:600; color:#333; border-bottom:2px solid #dce0e5; padding-bottom:10px; margin-bottom:10px;">

                    <span style="text-align:center;">Situação</span>
                </div>

            pneusParaCadastrar.forEach((p, index) => {

                        <div style="display:flex; gap:8px; flex-wrap:wrap;">
                            <input type="text" id="dot_multi_${index}" placeholder="DOT/Fogo (ex: DOT 1234)" value="${p.dot}" style="flex:1; min-width:150px; padding:8px 12px; border:2px solid #dce0e5; border-radius:6px; font-size:13px;">
                            <select id="situacao_multi_${index}" style="padding:8px 12px; border:2px solid #dce0e5; border-radius:6px; font-size:13px; background:white;">
                                ${situacaoSelect}
                            </select>
                        </div>
                        <span style="font-size:12px; color:#666;">${p.nome} ${p.tamanho}</span>
                    </div>
                `;
            });
            
            html += `
                <div style="margin-top:15px; padding:10px; background:#f8f9fa; border-radius:8px; display:flex; gap:20px; flex-wrap:wrap; font-size:13px;">
                    <span><strong>Total:</strong> ${pneusParaCadastrar.length} pneus</span>
                    <span><strong>Marca:</strong> ${pneusParaCadastrar[0]?.nome || '-'}</span>
                    <span><strong>Tamanho:</strong> ${pneusParaCadastrar[0]?.tamanho || '-'}</span>
                    <span><strong>Tipo:</strong> ${pneusParaCadastrar[0]?.tipo || '-'}</span>
                    <span><strong>Valor Unitário:</strong> R$ ${pneusParaCadastrar[0]?.valor?.toFixed(2) || '0,00'}</span>
                    <span><strong>Outros Valores:</strong> R$ ${pneusParaCadastrar[0]?.outrosValores?.toFixed(2) || '0,00'}</span>
                    <span><strong>Data Entrada:</strong> ${pneusParaCadastrar[0]?.dataEntrada || '-'}</span>
                </div>
            `;
            
            lista.innerHTML = html;
            modal.classList.add('show');
        }

        function fecharModalCadastroMultiplo() {
            document.getElementById('modalCadastroMultiplo').classList.remove('show');
            pneusParaCadastrar = [];
        }

        function confirmarCadastroMultiplo() {
            const pneus = getPneus();
            let cadastrados = 0;
            let erros = [];
            
            pneusParaCadastrar.forEach((p, index) => {
                const dotInput = document.getElementById(`dot_multi_${index}`);
                const situacaoSelect = document.getElementById(`situacao_multi_${index}`);
                
                const dot = dotInput ? dotInput.value.trim() : p.dot;
                const situacao = situacaoSelect ? situacaoSelect.value : p.situacao;
                
                if (!dot) {
                    erros.push(`Pneu #${p.index} sem DOT/Fogo informado.`);
                }
                
                const pneu = criarPneu(
                    p.nome,
                    dot || 'Não informado',
                    p.tamanho,
                    p.tipo,
                    situacao,
                    p.valor,
                    p.outrosValores || 0,
                    p.dataEntrada
                );
                pneus.push(pneu);
                cadastrados++;
            });
            
            if (erros.length > 0) {
                const confirmar = confirm(
                    `⚠️ ATENÇÃO: ${erros.length} pneu(s) estão sem DOT/Fogo.\n\n` +
                    erros.join('\n') +
                    `\n\nDeseja continuar mesmo assim?`
                );
                if (!confirmar) {
                    return;
                }
            }
            
            setPneus(pneus);
            
            fecharModalCadastroMultiplo();
            limparFormPneu();
            renderEstoque();
            atualizarLimitesUI();
            switchTab('tab-estoque');
            alert(`✅ ${cadastrados} pneu(s) cadastrado(s) com sucesso!`);
        }

        function getEstruturaEixos(tipo, eixos) {
            const estrutura = [];
            
            if (tipo === 'cavalo_3_eixos') {
                estrutura.push({ nome: 'Dianteiro', qtd: 2, tipo: 'dianteiro' });
                estrutura.push({ nome: 'Tração', qtd: 4, tipo: 'traseiro' });
                estrutura.push({ nome: 'Truck', qtd: 4, tipo: 'traseiro' });
            } else if (tipo === '4_eixos') {
                estrutura.push({ nome: 'Dianteiro', qtd: 2, tipo: 'dianteiro' });
                estrutura.push({ nome: '4° Eixo', qtd: 2, tipo: 'traseiro' });
                estrutura.push({ nome: '1° Eixo Traseiro', qtd: 4, tipo: 'traseiro' });
                estrutura.push({ nome: '2° Eixo Traseiro', qtd: 4, tipo: 'traseiro' });
            } else if (tipo === 'carreta') {
                for (let i = 1; i <= eixos; i++) {
                    estrutura.push({ 
                        nome: `${i}° Eixo`, 
                        qtd: 4, 
                        tipo: i === 1 ? 'dianteiro' : 'traseiro' 
                    });
                }
            }
            
            return estrutura;
        }

        // ============================================
        //  VERIFICAR ALERTA DE DESGASTE
        // ============================================
        function verificarAlertaDesgaste(pneu) {
            if (!pneu || !pneu.faixas) return false;
            const faixas = pneu.faixas;
            const valores = [faixas.f1 || 0, faixas.f2 || 0, faixas.f3 || 0, faixas.f4 || 0];
            return valores.some(v => v > 0 && v < 5);
        }

        function calcularDiferencaFaixas(pneu) {
            if (!pneu || !pneu.faixas) return 0;
            const valores = [pneu.faixas.f1 || 0, pneu.faixas.f2 || 0, pneu.faixas.f3 || 0, pneu.faixas.f4 || 0];
            const filtrados = valores.filter(v => v > 0);
            if (filtrados.length < 2) return 0;
            return Math.max(...filtrados) - Math.min(...filtrados);
        }

        function estimarVidaRestante(pneu, mmReferencia) {
            if (!pneu || !pneu.faixas) return null;
            const valores = [pneu.faixas.f1 || 0, pneu.faixas.f2 || 0, pneu.faixas.f3 || 0, pneu.faixas.f4 || 0];
            const filtrados = valores.filter(v => v > 0);
            if (filtrados.length === 0) return null;
            
            const media = filtrados.reduce((a, b) => a + b, 0) / filtrados.length;
            const mmPorKm = 0.0001;
            
            const kmAte3_5 = Math.max(0, (media - 3.5) / mmPorKm);
            const diasAte3_5 = kmAte3_5 / 300;
            
            return {
                km: Math.round(kmAte3_5),
                dias: Math.round(diasAte3_5),
                media: media,
                mmPorKm: mmPorKm
            };
        }

        // ============================================
        //  RENDER ESTOQUE DE PNEUS
        // ============================================
        function renderEstoque() {
            const pneus = getPneus();
            const filtroNome = document.getElementById('filtroPneuNome')?.value.toLowerCase() || '';
            const filtroTamanho = document.getElementById('filtroPneuTamanho')?.value || '';
            const filtroSituacao = document.getElementById('filtroPneuSituacao')?.value || '';
            const filtroStatus = document.getElementById('filtroPneuStatus')?.value || '';

            const pneusFiltrados = pneus.filter(p => {
                const matchNome = p.nome.toLowerCase().includes(filtroNome);
                const matchTamanho = !filtroTamanho || p.tamanho === filtroTamanho;
                const matchSituacao = !filtroSituacao || p.situacao === filtroSituacao;
                const matchStatus = !filtroStatus || p.status === filtroStatus;
                return matchNome && matchTamanho && matchSituacao && matchStatus;
            });

            const tbody = document.getElementById('estoqueTableBody');

            if (pneusFiltrados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="13" class="empty-state"><p>${pneus.length === 0 ? 'Nenhum pneu cadastrado ainda.' : 'Nenhum pneu encontrado com os filtros aplicados.'}</p></td></tr>`;
                document.getElementById('totalPneus').textContent = `Total: ${pneus.length}`;
                document.getElementById('totalItensPneus').textContent = `Itens: ${pneus.length}`;
                return;
            }

            let html = '';
            pneusFiltrados.forEach((p, index) => {
                const badgeSituacao = {
                    'novo': 'badge-novo',
                    'meia vida': 'badge-meia',
                    'recapado': 'badge-recap',
                    'carcaça': 'badge-carcaça',
                    'vulcanizado': 'badge-vulcanizado'
                } [p.situacao] || '';

                let tipoDisplay = p.tipo;
                if (p.tipoRecapagem) {
                    const tipoMap = {
                        'banda_leve': 'Banda Leve',
                        'misto': 'Misto',
                        'borrachudo': 'Borrachudo',
                        'outros': p.tipoRecapagemOutros || 'Outros'
                    };
                    tipoDisplay = tipoMap[p.tipoRecapagem] || p.tipoRecapagem;
                }

                const badgeTipo = {
                    'liso': 'badge-liso',
                    'misto': 'badge-misto',
                    'borrachudo': 'badge-borrachudo'
                } [p.tipo] || '';

                const badgeStatus = {
                    'disponivel': 'badge-disponivel',
                    'instalado': 'badge-instalado',
                    'recapagem': 'badge-recap',
                    'vulcanizacao': 'badge-vulcanizado'
                } [p.status] || 'badge-disponivel';

                let statusLabel = p.status || 'disponivel';
                if (statusLabel === 'instalado' && p.veiculoInstalado) {
                    statusLabel = `Instalado (${p.veiculoInstalado})`;
                } else if (statusLabel === 'instalado') {
                    statusLabel = 'Instalado';
                } else if (statusLabel === 'recapagem') {
                    statusLabel = 'Em Recapagem';
                } else if (statusLabel === 'vulcanizacao') {
                    statusLabel = 'Em Vulcanização';
                } else {
                    statusLabel = 'Disponível';
                }

                const emUso = (() => {
                    const veiculos = getVeiculos();
                    let usado = false;
                    veiculos.forEach(v => {
                        if (v.pneus) {
                            Object.values(v.pneus).forEach(pneuId => {
                                if (pneuId === p.id) usado = true;
                            });
                        }
                    });
                    return usado;
                })();

                const shortId = p.id.toString().slice(-6);
                const temAlerta = verificarAlertaDesgaste(p);
                const contadorRecap = p.contadorRecapagens || 0;
                const contadorVulc = p.contadorVulcanizacoes || 0;

                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td><span class="pneu-id">#${shortId}</span>${temAlerta ? ' 🔴' : ''}</td>
                        <td><strong>${p.nome}</strong>
                            ${contadorRecap > 0 ? `<span class="contador-badge">🔄 ${contadorRecap}x</span>` : ''}
                            ${contadorVulc > 0 ? `<span class="contador-badge" style="background:#ab47bc;color:#fff;">⚡ ${contadorVulc}x</span>` : ''}
                        </td>
                        <td><span class="pneu-dot">${p.dot || '-'}</span></td>
                        <td>${p.tamanho}</td>
                        <td><span class="badge ${badgeTipo}">${tipoDisplay}</span></td>
                        <td><span class="badge ${badgeSituacao}">${p.situacao}</span></td>
                        <td><span class="badge ${badgeStatus}">${statusLabel}</span></td>
                        <td>R$ ${p.valor.toFixed(2)}</td>
                        <td>R$ ${(p.outrosValores || 0).toFixed(2)}</td>
                        <td>${(p.kmTotal || 0).toLocaleString('pt-BR')}</td>
                        <td>${p.dataEntrada || p.dataCadastro}</td>
                        <td>
                            <button class="btn-info" onclick="abrirModalEdicaoIndividual(${p.id})" title="Editar Pneu">✏️</button>
                            <button class="btn-danger" onclick="excluirPneuIndividual(${p.id})" ${emUso ? 'disabled style="opacity:0.5;"' : ''} title="${emUso ? 'Pneu em uso' : 'Excluir'}">
                                ${emUso ? '🔒' : '🗑️'}
                            </button>
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
            document.getElementById('totalPneus').textContent = `Total: ${pneus.length}`;
            document.getElementById('totalItensPneus').textContent = `Itens: ${pneusFiltrados.length}`;
            
            window._pneusFiltrados = pneusFiltrados;
        }

        function excluirPneuIndividual(id) {
            if (!confirm('Tem certeza que deseja excluir este pneu?')) return;

            let pneus = getPneus();
            pneus = pneus.filter(p => p.id !== id);
            setPneus(pneus);
            renderEstoque();
            atualizarLimitesUI();

        //  EDIÇÃO DE PNEU INDIVIDUAL
        // ============================================

        function abrirModalEdicaoIndividual(id) {
            const pneus = getPneus();
            const pneu = pneus.find(p => p.id === id);
            
            if (!pneu) {
                alert('Pneu não encontrado.');
                return;
            }

            const infoBox = document.getElementById('pneuEdicaoInfo');
            infoBox.innerHTML = `
                <div class="info-row"><span class="label">ID:</span> <span>#${id.toString().slice(-6)}</span></div>
                <div class="info-row"><span class="label">Pneu:</span> <span>${pneu.nome}</span></div>
                <div class="info-row"><span class="label">DOT/Fogo:</span> <span>${pneu.dot || 'Não informado'}</span></div>
                <div class="info-row"><span class="label">Tamanho:</span> <span>${pneu.tamanho}</span></div>
                <div class="info-row"><span class="label">Situação:</span> <span>${pneu.situacao}</span></div>
                <div class="info-row"><span class="label">Status:</span> <span>${pneu.status || 'Disponível'}</span></div>
                <div class="info-row"><span class="label">Valor:</span> <span>R$ ${pneu.valor.toFixed(2)}</span></div>
                <div class="info-row"><span class="label">Outros Valores:</span> <span>R$ ${(pneu.outrosValores || 0).toFixed(2)}</span></div>
                <div class="info-row"><span class="label">KM Total:</span> <span>${(pneu.kmTotal || 0).toLocaleString('pt-BR')}</span></div>
                <div class="info-row"><span class="label">Contador Recapagens:</span> <span>${pneu.contadorRecapagens || 0}</span></div>
                <div class="info-row"><span class="label">Contador Vulcanizações:</span> <span>${pneu.contadorVulcanizacoes || 0}</span></div>
                <div class="info-row"><span class="label">Tipo Recapagem:</span> <span>${pneu.tipoRecapagem ? (pneu.tipoRecapagem === 'outros' ? pneu.tipoRecapagemOutros || 'Outros' : pneu.tipoRecapagem) : 'N/A'}</span></div>
                <div class="info-row"><span class="label">Data Entrada:</span> <span>${pneu.dataEntrada || pneu.dataCadastro}</span></div>
            `;

            document.getElementById('editPneuDot').value = pneu.dot || '';
            document.getElementById('valorRecapagem').value = pneu.valorRecapagem || '';
            document.getElementById('valorVulcanizacao').value = pneu.valorVulcanizacao || '';
            document.getElementById('editOutrosValores').value = pneu.outrosValores || '';
            document.getElementById('editTipoRecapagem').value = pneu.tipoRecapagem || '';
            document.getElementById('editTipoRecapagemOutros').value = pneu.tipoRecapagemOutros || '';
            document.getElementById('editTipoRecapagemOutros').style.display = pneu.tipoRecapagem === 'outros' ? 'block' : 'none';
            document.getElementById('acaoEdicao').value = '';

            document.getElementById('editTipoRecapagem').onchange = function() {
                const outros = document.getElementById('editTipoRecapagemOutros');
                outros.style.display = this.value === 'outros' ? 'block' : 'none';
                if (this.value !== 'outros') outros.value = '';
            };

            document.getElementById('modalEdicao').classList.add('show');
        }

        function fecharModalEdicao() {
            document.getElementById('modalEdicao').classList.remove('show');
            idsEdicao = [];
        }

        function confirmarEdicao() {
            const dot = document.getElementById('editPneuDot').value.trim();
            const valorRecapagem = parseFloat(document.getElementById('valorRecapagem').value) || 0;
            const valorVulcanizacao = parseFloat(document.getElementById('valorVulcanizacao').value) || 0;
            const outrosValores = parseFloat(document.getElementById('editOutrosValores').value) || 0;
            const tipoRecapagem = document.getElementById('editTipoRecapagem').value;
            const tipoRecapagemOutros = document.getElementById('editTipoRecapagemOutros').value.trim();
            const acao = document.getElementById('acaoEdicao').value;

            if (!acao && dot === '' && valorRecapagem === 0 && valorVulcanizacao === 0 && outrosValores === 0 && !tipoRecapagem) {
                alert('Selecione uma ação ou adicione um valor ou altere o DOT ou tipo de recapagem.');
                return;
            }

            const pneus = getPneus();
            let pneusAtualizados = 0;

            idsEdicao.forEach(id => {
                const pneu = pneus.find(p => p.id === id);
                if (!pneu) return;

                if (dot !== '') {
                    pneu.dot = dot;
                }

                if (valorRecapagem > 0) {
                    pneu.valorRecapagem = valorRecapagem;
                    pneu.valor += valorRecapagem;
                    pneu.contadorRecapagens = (pneu.contadorRecapagens || 0) + 1;
                }
                if (valorVulcanizacao > 0) {
                    pneu.valorVulcanizacao = valorVulcanizacao;
                    pneu.valor += valorVulcanizacao;
                    pneu.contadorVulcanizacoes = (pneu.contadorVulcanizacoes || 0) + 1;
                }
                if (outrosValores > 0) {
                    pneu.outrosValores = (pneu.outrosValores || 0) + outrosValores;
                    pneu.valor += outrosValores;
                }
                if (tipoRecapagem) {
                    pneu.tipoRecapagem = tipoRecapagem;
                    if (tipoRecapagem === 'outros') {
                        pneu.tipoRecapagemOutros = tipoRecapagemOutros || 'Outros';
                    } else {
                        pneu.tipoRecapagemOutros = null;
                    }
                }

                if (acao === 'recapagem') {
                    pneu.situacao = 'recapado';
                    pneu.status = 'disponivel';
                    pneu.veiculoInstalado = null;
                    pneu.veiculoId = null;
                    pneu.posicao = null;
                    pneu.kmInstalacao = null;
                    pneu.contadorRecapagens = (pneu.contadorRecapagens || 0) + 1;
                    pneu.historico = pneu.historico || [];
                    pneu.historico.push({
                        data: new Date().toLocaleString('pt-BR'),
                        acao: 'Recapagem',
                        detalhes: `Pneu recapado com valor de R$ ${valorRecapagem.toFixed(2)}${tipoRecapagem ? `, Tipo: ${tipoRecapagem === 'outros' ? tipoRecapagemOutros : tipoRecapagem}` : ''}`
                    });
                    pneusAtualizados++;
                } else if (acao === 'vulcanizacao') {
                    pneu.situacao = 'vulcanizado';
                    pneu.status = 'disponivel';
                    pneu.veiculoInstalado = null;
                    pneu.veiculoId = null;
                    pneu.posicao = null;
                    pneu.kmInstalacao = null;
                    pneu.contadorVulcanizacoes = (pneu.contadorVulcanizacoes || 0) + 1;
                    pneu.historico = pneu.historico || [];
                    pneu.historico.push({
                        data: new Date().toLocaleString('pt-BR'),
                        acao: 'Vulcanização',
                        detalhes: `Pneu vulcanizado com valor de R$ ${valorVulcanizacao.toFixed(2)}`
                    });
                    pneusAtualizados++;
                } else if (acao === 'descarte') {
                    const descartados = getDescartados();
                    pneu.motivoDescarte = 'Descartado via edição';
                    pneu.dataDescarte = new Date().toLocaleDateString('pt-BR');
                    descartados.push({...pneu});
                    setDescartados(descartados);
                    
                    const idxPneu = pneus.findIndex(p => p.id === id);
                    if (idxPneu !== -1) {
                        pneus.splice(idxPneu, 1);
                    }
                    pneusAtualizados++;
                }
            });

            setPneus(pneus);
            fecharModalEdicao();
            renderEstoque();
            renderDescartados();
            renderRelatorios();
            atualizarLimitesUI();
            
            if (acao === 'descarte') {
                alert(`✅ ${pneusAtualizados} pneu(s) descartado(s) com sucesso!`);
            } else if (acao) {
                alert(`✅ ${pneusAtualizados} pneu(s) atualizado(s) com sucesso!`);
            } else {
                alert('✅ Dados atualizados com sucesso!');
            }
        }

        // ============================================
        //  RENDER ESTOQUE DE PEÇAS
        // ============================================
        function renderPecas() {
            const permissoes = getPermissoes(getCurrentUser());
            if (!permissoes.pecas && !isMaster()) {
                document.getElementById('pecasContent').style.display = 'none';
                document.getElementById('pecasBlocked').style.display = 'block';
                return;
            }
            document.getElementById('pecasContent').style.display = 'block';
            document.getElementById('pecasBlocked').style.display = 'none';

            const pecas = getPecas();
            const filtroNome = document.getElementById('filtroPecaNome')?.value.toLowerCase() || '';
            const filtroCategoria = document.getElementById('filtroPecaCategoria')?.value || '';
            const filtroStatus = document.getElementById('filtroPecaStatus')?.value || '';

            const pecasFiltradas = pecas.filter(p => {
                const matchNome = p.nome.toLowerCase().includes(filtroNome);
                const matchCategoria = !filtroCategoria || p.categoria === filtroCategoria;
                const matchStatus = !filtroStatus || p.status === filtroStatus;
                return matchNome && matchCategoria && matchStatus;
            });

            const grid = document.getElementById('pecasGrid');

            if (pecasFiltradas.length === 0) {
                grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><p>${pecas.length === 0 ? 'Nenhuma peça cadastrada ainda.' : 'Nenhuma peça encontrada com os filtros aplicados.'}</p></div>`;
                document.getElementById('totalPecas').textContent = `Total: ${pecas.length}`;
                document.getElementById('totalItensPecas').textContent = `Itens: ${pecas.length}`;
                return;
            }

            let html = '';
            pecasFiltradas.forEach((p) => {
                const badgeStatus = {
                    'disponivel': 'badge-disponivel',
                    'instalado': 'badge-instalado-peca'
                } [p.status] || 'badge-disponivel';

                let statusLabel = p.status || 'disponivel';
                if (statusLabel === 'instalado' && p.veiculoInstalado) {
                    statusLabel = `Instalado (${p.veiculoInstalado})`;
                    if (p.posicao) {
                        statusLabel += ` - ${p.posicao}`;
                    }
                } else if (statusLabel === 'instalado') {
                    statusLabel = 'Instalado';
                } else {
                    statusLabel = 'Disponível';
                }

                html += `
                    <div class="peca-card">
                        <div class="peca-card-header">
                            <h4>${p.nome}</h4>
                            <span class="badge ${badgeStatus}">${statusLabel}</span>
                        </div>
                        <div class="peca-card-info">
                            <span><span class="label">Categoria:</span> ${p.categoria}</span>
                            <span><span class="label">Valor:</span> R$ ${p.valor.toFixed(2)}</span>
                            <span><span class="label">Fornecedor:</span> ${p.fornecedor || 'Não informado'}</span>
                            <span><span class="label">Qtd:</span> 1</span>
                        </div>
                        <div class="peca-card-actions">
                            <button class="btn-danger" onclick="excluirPecaIndividual(${p.id})">🗑️</button>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;
            document.getElementById('totalPecas').textContent = `Total: ${pecas.length}`;
            document.getElementById('totalItensPecas').textContent = `Itens: ${pecasFiltradas.length}`;
        }

        function filtrarPecas() {
            renderPecas();
        }

        function limparFiltrosPecas() {
            document.getElementById('filtroPecaNome').value = '';
            document.getElementById('filtroPecaCategoria').value = '';
            document.getElementById('filtroPecaStatus').value = '';

            if (!confirm('Tem certeza que deseja excluir esta peça?')) return;

            let pecas = getPecas();
            pecas = pecas.filter(p => p.id !== id);

        // ============================================
        //  RENDER VEÍCULOS
        // ============================================
        function renderVeiculos() {
            const permissoes = getPermissoes(getCurrentUser());
            if (!permissoes.veiculos.limite && !isMaster()) {
                document.getElementById('veiculosContent').style.display = 'none';
                document.getElementById('veiculosBlocked').style.display = 'block';
                return;
            }
            document.getElementById('veiculosContent').style.display = 'block';
            document.getElementById('veiculosBlocked').style.display = 'none';

            const veiculos = getVeiculos();
            const filtroPlaca = document.getElementById('filtroVeiculoPlaca')?.value.toUpperCase() || '';
            const filtroMotorista = document.getElementById('filtroVeiculoMotorista')?.value.toLowerCase() || '';
            const filtroStatus = document.getElementById('filtroVeiculoStatus')?.value || '';
            const filtroTipo = document.getElementById('filtroVeiculoTipo')?.value || '';

            const veiculosFiltrados = veiculos.filter(v => {
                const matchPlaca = v.placa.includes(filtroPlaca);
                const matchMotorista = v.motorista.toLowerCase().includes(filtroMotorista);
                const matchStatus = !filtroStatus || v.status === filtroStatus;
                const matchTipo = !filtroTipo || v.tipo === filtroTipo;
                return matchPlaca && matchMotorista && matchStatus && matchTipo;
            });

            const grid = document.getElementById('veiculosGrid');

            if (veiculosFiltrados.length === 0) {
                grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><p>${veiculos.length === 0 ? 'Nenhum veículo cadastrado ainda.' : 'Nenhum veículo encontrado com os filtros aplicados.'}</p></div>`;
                document.getElementById('totalVeiculos').textContent = `Total: ${veiculos.length}`;
                document.getElementById('veiculosAtivos').textContent = `Ativos: ${veiculos.filter(v => v.status === 'ativo').length}`;
                return;
            }

            let ativos = 0;
            let html = '';
            veiculosFiltrados.forEach((v) => {
                if (v.status === 'ativo') ativos++;
                const statusBadge = v.status === 'ativo' ? 'badge-ativo' : v.status === 'vendido' ? 'badge-vendido' : 'badge-inativo';
                const totalPneus = v.estruturaEixos ? v.estruturaEixos.reduce((sum, e) => sum + e.qtd, 0) + 4 : 0;
                const pneusInstalados = v.pneus ? Object.keys(v.pneus).length : 0;
                const pecasInstaladas = v.pecas ? Object.keys(v.pecas).length : 0;
                
                const tipoLabel = {
                    'cavalo_3_eixos': 'Cavalo - 3 Eixos',
                    '4_eixos': '4 Eixos',
                    'carreta': 'Carreta'
                } [v.tipo] || v.tipo;

                const combinadoInfo = v.combinadoCom ? `🔗 ${veiculos.find(w => w.id === v.combinadoCom)?.placa || 'Combinado'}` : '';

                let alertas = [];
                if (v.servicos && v.servicos.length > 0) {
                    const ultimo = v.servicos[v.servicos.length - 1];
                    const diasPassados = Math.floor((Date.now() - new Date(ultimo.data).getTime()) / (1000 * 60 * 60 * 24));
                    if (diasPassados > 180) {
                        alertas.push({ texto: `⚠️ ${ultimo.tipo} há ${diasPassados} dias`, tipo: 'critico' });
                    } else if (diasPassados > 90) {
                        alertas.push({ texto: `🟡 ${ultimo.tipo} há ${diasPassados} dias`, tipo: 'atencao' });
                    } else if (diasPassados > 30) {
                        alertas.push({ texto: `🔵 ${ultimo.tipo} há ${diasPassados} dias`, tipo: 'ok' });
                    }
                }

                if (v.pneus) {
                    const pneus = getPneus();
                    Object.values(v.pneus).forEach(pneuId => {
                        const pneu = pneus.find(p => p.id === pneuId);
                        if (pneu && verificarAlertaDesgaste(pneu)) {
                            alertas.push({ texto: `🔴 ${pneu.nome} - desgaste crítico`, tipo: 'critico' });
                        }
                    });
                }

                const alertasHtml = alertas.length > 0 ? 
                    `<div class="resumo-alertas">${alertas.map(a => `<span class="alerta-item ${a.tipo}">${a.texto}</span>`).join(' ')}</div>` :
                    `<div class="resumo-alertas"><span class="alerta-item ok">✅ Sem alertas críticos</span></div>`;

                html += `
                    <div class="veiculo-card" onclick="abrirModalCaminhao(${v.id})">
                        <div class="veiculo-card-header">
                            <h3>${v.marca} ${v.modelo} ${combinadoInfo}</h3>
                            <div>
                                <span class="badge ${statusBadge}">${v.status}</span>
                                <span class="badge badge-info" style="background:#e3f2fd;color:#1a3a5c;">${tipoLabel}</span>
                            </div>
                        </div>
                        <div class="veiculo-card-info">
                            <span><span class="label">Placa:</span> ${v.placa}</span>
                            <span><span class="label">Motorista:</span> ${v.motorista || 'Não vinculado'}</span>
                            <span><span class="label">KM:</span> ${v.km.toLocaleString('pt-BR')}</span>
                            <span><span class="label">Eixos:</span> ${v.eixos}</span>
                            <span><span class="label">Pneus:</span> ${pneusInstalados} / ${totalPneus}</span>
                            <span><span class="label">Peças:</span> ${pecasInstaladas}</span>
                        </div>
                        ${alertasHtml}
                        <div class="veiculo-card-actions">
                            <button class="btn-orange" onclick="event.stopPropagation(); abrirModalManutencaoSimplificada()" title="Adicionar Serviço">🔧</button>
                            <button class="btn-purple" onclick="event.stopPropagation(); abrirModalSelecaoPeca(${v.id})" title="Instalar Peça">🔧</button>
                            <button class="btn-danger" onclick="event.stopPropagation(); excluirVeiculo(${v.id})">🗑️</button>
                            <button class="btn-info" onclick="event.stopPropagation(); toggleStatusVeiculo(${v.id})">${v.status === 'ativo' ? '🔄' : '✅'}</button>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;
            document.getElementById('totalVeiculos').textContent = `Total: ${veiculos.length}`;
            document.getElementById('veiculosAtivos').textContent = `Ativos: ${ativos}`;
        }

            const filtroCpf = document.getElementById('filtroMotoristaCpf')?.value.replace(/[^0-9]/g, '') || '';

            const motoristasFiltrados = motoristas.filter(m => {
                const matchNome = m.nome.toLowerCase().includes(filtroNome);
                const matchCpf = !filtroCpf || m.cpf.replace(/[^0-9]/g, '').includes(filtroCpf);
                return matchNome && matchCpf;
            });

            const grid = document.getElementById('motoristasGrid');

            if (motoristasFiltrados.length === 0) {
                grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><p>${motoristas.length === 0 ? 'Nenhum motorista cadastrado ainda.' : 'Nenhum motorista encontrado com os filtros aplicados.'}</p></div>`;
                document.getElementById('totalMotoristas').textContent = `Total: ${motoristas.length}`;
                return;
            }

            let html = '';
            motoristasFiltrados.forEach((m) => {
                const veiculos = getVeiculos();
                const veiculoVinculado = veiculos.find(v => v.motorista === m.nome);

                html += `
                    <div class="veiculo-card" style="cursor:default;">
                        <div class="veiculo-card-header">
                            <h3>${m.nome}</h3>
                            ${veiculoVinculado ? `<span class="badge badge-ativo">🚗 ${veiculoVinculado.placa}</span>` : ''}
                        </div>
                        <div class="veiculo-card-info">
                            <span><span class="label">CPF:</span> ${m.cpf}</span>
                            <span><span class="label">Tipo Sanguíneo:</span> ${m.sangue}</span>
                            <span><span class="label">Celular:</span> ${m.celular}</span>
                            <span><span class="label">Emergência:</span> ${m.emergencia}</span>
                            ${m.obs ? `<span style="grid-column:1/-1;"><span class="label">Obs:</span> ${m.obs}</span>` : ''}
                            <span style="grid-column:1/-1; font-size:12px; color:#999;">Cadastro: ${m.dataCadastro}</span>
                        </div>
                        <div class="veiculo-card-actions">
                            <button class="btn-danger" onclick="excluirMotorista(${m.id})">🗑️</button>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;
            document.getElementById('totalMotoristas').textContent = `Total: ${motoristas.length}`;
        }

        function filtrarMotoristas() {
            renderMotoristas();
        }

        function limparFiltrosMotoristas() {
            document.getElementById('filtroMotoristaNome').value = '';
            document.getElementById('filtroMotoristaCpf').value = '';
            renderMotoristas();
        }

        function excluirMotorista(id) {
            if (!confirm('Tem certeza que deseja excluir este motorista?')) return;

            let motoristas = getMotoristas();
            motoristas = motoristas.filter(m => m.id !== id);
            setMotoristas(motoristas);
            atualizarSelectMotoristas();
            renderMotoristas();
        }

        function cadastrarMotorista(e) {
            e.preventDefault();

            const permissoes = getPermissoes(getCurrentUser());
            if (!permissoes.motoristas && !isMaster()) {
                alert('🔒 Você não tem permissão para cadastrar motoristas.');
                return;
            }

            const nome = document.getElementById('motoristaNome').value.trim();
            const cpf = document.getElementById('motoristaCpf').value.trim();
            const sangue = document.getElementById('motoristaSangue').value;
            const celular = document.getElementById('motoristaCelular').value.trim();
            const emergencia = document.getElementById('motoristaEmergencia').value.trim();
            const obs = document.getElementById('motoristaObs').value.trim();

            if (!nome) {
                alert('Por favor, digite o nome do motorista.');
                return;
            }

            if (cpf) {
                const motoristas = getMotoristas();
                if (motoristas.find(m => m.cpf === cpf)) {
                    alert('Este CPF já está cadastrado.');
                    return;
                }
            }

            const motorista = {
                id: Date.now() + Math.random() * 1000,
                nome: nome,
                cpf: cpf || 'Não informado',
                sangue: sangue || 'Não informado',
                celular: celular || 'Não informado',
                emergencia: emergencia || 'Não informado',
                obs: obs || '',
                dataCadastro: new Date().toLocaleDateString('pt-BR'),
                dataCadastroCompleta: new Date().toISOString()
            };

            const motoristas = getMotoristas();
            motoristas.push(motorista);
            setMotoristas(motoristas);

            document.getElementById('motoristaForm').reset();
            document.getElementById('motoristaSangue').value = '';

            atualizarSelectMotoristas();
            renderMotoristas();
            atualizarFiltrosRelatorios();
            alert('✅ Motorista cadastrado com sucesso!');
        }

        // ============================================
        //  RENDER DESCARTADOS
        // ============================================
        function renderDescartados() {
            const permissoes = getPermissoes(getCurrentUser());
            if (!permissoes.descartados && !isMaster()) {
                document.getElementById('descartadosContent').style.display = 'none';
                document.getElementById('descartadosBlocked').style.display = 'block';
                return;
            }
            document.getElementById('descartadosContent').style.display = 'block';
            document.getElementById('descartadosBlocked').style.display = 'none';

            const descartados = getDescartados();
            const filtroNome = document.getElementById('filtroDescarteNome')?.value.toLowerCase() || '';
            const filtroTamanho = document.getElementById('filtroDescarteTamanho')?.value || '';
            const filtroMotivo = document.getElementById('filtroDescarteMotivo')?.value.toLowerCase() || '';

            const descartadosFiltrados = descartados.filter(p => {
                const matchNome = p.nome.toLowerCase().includes(filtroNome);
                const matchTamanho = !filtroTamanho || p.tamanho === filtroTamanho;
                const matchMotivo = (p.motivoDescarte || '').toLowerCase().includes(filtroMotivo);
                return matchNome && matchTamanho && matchMotivo;
            });

            const tbody = document.getElementById('descartadosTableBody');

            if (descartadosFiltrados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" class="empty-state"><p>${descartados.length === 0 ? 'Nenhum pneu descartado ainda.' : 'Nenhum pneu encontrado com os filtros aplicados.'}</p></td></tr>`;
                document.getElementById('totalDescartados').textContent = `Total: ${descartados.length}`;
                return;
            }

            let html = '';
            descartadosFiltrados.forEach((p, index) => {
                const badgeTipo = {
                    'liso': 'badge-liso',
                    'misto': 'badge-misto',
                    'borrachudo': 'badge-borrachudo'
                } [p.tipo] || '';

                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td><strong>${p.nome}</strong></td>
                        <td>${p.dot || '-'}</td>
                        <td>${p.tamanho}</td>
                        <td><span class="badge ${badgeTipo}">${p.tipo}</span></td>
                        <td>${p.veiculoInstalado || 'Não informado'}</td>
                        <td>${p.posicao || 'Não informado'}</td>
                        <td>${p.motivoDescarte || 'Descarte'}</td>
                        <td>${p.dataDescarte || p.dataCadastro}</td>
                        <td>R$ ${p.valor.toFixed(2)}</td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
            document.getElementById('totalDescartados').textContent = `Total: ${descartados.length}`;
        }

        function filtrarDescartados() {
            renderDescartados();
        }

        function limparFiltrosDescartados() {
            document.getElementById('filtroDescarteNome').value = '';
            document.getElementById('filtroDescarteTamanho').value = '';
            document.getElementById('filtroDescarteMotivo').value = '';
            renderDescartados();
        }

        // ============================================
        //  ATUALIZAR FILTROS DOS RELATÓRIOS
        // ============================================
        function atualizarFiltrosRelatorios() {
            const veiculos = getVeiculos();
            const motoristas = getMotoristas();
            const pneus = getPneus();

            const selectVeiculo = document.getElementById('filtroRelatorioVeiculo');
            selectVeiculo.innerHTML = '<option value="">Todos</option>';
            veiculos.forEach(v => {
                selectVeiculo.innerHTML += `<option value="${v.placa}">${v.placa} - ${v.marca} ${v.modelo}</option>`;
            });

            const selectMotorista = document.getElementById('filtroRelatorioMotorista');
            selectMotorista.innerHTML = '<option value="">Todos</option>';
            motoristas.forEach(m => {
                selectMotorista.innerHTML += `<option value="${m.nome}">${m.nome}</option>`;
            });

            const selectPneu = document.getElementById('filtroRelatorioPneu');
            selectPneu.innerHTML = '<option value="">Todos</option>';
            const pneusUnicos = {};
            pneus.forEach(p => {
                const key = `${p.nome} - ${p.tamanho}`;
                if (!pneusUnicos[key]) {
                    pneusUnicos[key] = true;
                    selectPneu.innerHTML += `<option value="${p.nome}">${p.nome} (${p.tamanho})</option>`;
                }
            });
        }

        // ============================================
        //  RELATÓRIOS
        // ============================================
        function renderRelatorios() {
            const permissoes = getPermissoes(getCurrentUser());
            if (!permissoes.relatorios && !isMaster()) {
                document.getElementById('relatoriosContent').style.display = 'none';
                document.getElementById('relatoriosBlocked').style.display = 'block';
                return;
            }
            document.getElementById('relatoriosContent').style.display = 'block';
            document.getElementById('relatoriosBlocked').style.display = 'none';

            let pneus = getPneus();
            const veiculos = getVeiculos();
            const pecas = getPecas();
            let manutencoes = getManutencoes();

            const filtroVeiculo = document.getElementById('filtroRelatorioVeiculo')?.value || '';
            const filtroMotorista = document.getElementById('filtroRelatorioMotorista')?.value || '';
            const filtroDataInicio = document.getElementById('filtroRelatorioDataInicio')?.value || '';
            const filtroDataFim = document.getElementById('filtroRelatorioDataFim')?.value || '';
            const filtroPneu = document.getElementById('filtroRelatorioPneu')?.value || '';
            const filtroEixo = document.getElementById('filtroRelatorioEixo')?.value || '';

            let veiculosFiltrados = veiculos;
            if (filtroVeiculo) {
                veiculosFiltrados = veiculosFiltrados.filter(v => v.placa === filtroVeiculo);
            }
            if (filtroMotorista) {
                veiculosFiltrados = veiculosFiltrados.filter(v => v.motorista === filtroMotorista);
            }

            if (filtroPneu) {
                pneus = pneus.filter(p => p.nome === filtroPneu);
            }

            if (filtroEixo) {
                pneus = pneus.filter(p => {
                    if (p.posicao) {
                        const pos = p.posicao.toLowerCase();
                        if (filtroEixo === 'dianteiro') return pos.includes('dianteiro');
                        if (filtroEixo === 'traseiro') return pos.includes('traseiro');
                        if (filtroEixo === 'estepe') return pos.includes('estepe');
                    }
                    return false;
                });
            }

            if (filtroDataInicio) {
                const dataInicio = new Date(filtroDataInicio);
                manutencoes = manutencoes.filter(m => {
                    const dataManutencao = new Date(m.data);
                    return dataManutencao >= dataInicio;
                });
                pneus = pneus.filter(p => {
                    const dataEntrada = new Date(p.dataEntrada || p.dataCadastro);
                    return dataEntrada >= dataInicio;
                });
            }
            if (filtroDataFim) {
                const dataFim = new Date(filtroDataFim);
                dataFim.setHours(23, 59, 59);
                manutencoes = manutencoes.filter(m => {
                    const dataManutencao = new Date(m.data);
                    return dataManutencao <= dataFim;
                });
                pneus = pneus.filter(p => {
                    const dataEntrada = new Date(p.dataEntrada || p.dataCadastro);
                    return dataEntrada <= dataFim;
                });
            }

            const placasFiltradas = veiculosFiltrados.map(v => v.placa);
            pneus = pneus.filter(p => {
                if (p.status === 'instalado' && p.veiculoInstalado) {
                    return placasFiltradas.length === 0 || placasFiltradas.includes(p.veiculoInstalado);
                }
                return true;
            });

            const totalPneus = pneus.length;
            const pneusInstalados = pneus.filter(p => p.status === 'instalado').length;
            const pneusDisponiveis = pneus.filter(p => p.status === 'disponivel' || !p.status).length;
            const valorTotal = pneus.reduce((sum, p) => sum + p.valor, 0);

            document.getElementById('totalPneusRelatorio').textContent = totalPneus;
            document.getElementById('totalPneusInstalados').textContent = pneusInstalados;
            document.getElementById('totalPneusDisponiveis').textContent = pneusDisponiveis;
            document.getElementById('valorTotalPneus').textContent = `R$ ${valorTotal.toFixed(2)}`;

            // Custo por KM
            const tbodyCusto = document.getElementById('relatorioCustoKmBody');
            const pneusComKm = pneus.filter(p => (p.kmTotal || 0) > 0);

            if (pneusComKm.length === 0) {
                tbodyCusto.innerHTML = `<tr><td colspan="8" class="empty-state"><p>Nenhum pneu com KM registrado.</p></td></tr>`;
            } else {
                let htmlCusto = '';
                let index = 0;
                pneusComKm.forEach(p => {
                    index++;
                    const custoPorKm = (p.kmTotal || 0) > 0 ? p.valor / (p.kmTotal || 1) : p.valor;
                    const statusLabel = p.status === 'instalado' ? 'Instalado' : 'Disponível';

                    htmlCusto += `
                        <tr>
                            <td>${index}</td>
                            <td><strong>${p.nome}</strong> (${p.tamanho})</td>
                            <td>${p.veiculoInstalado || 'Não instalado'}</td>
                            <td>${p.posicao || '-'}</td>
                            <td>R$ ${p.valor.toFixed(2)}</td>
                            <td>${(p.kmTotal || 0).toLocaleString('pt-BR')}</td>
                            <td><strong>R$ ${custoPorKm.toFixed(4)}</strong></td>
                            <td><span class="badge ${p.status === 'instalado' ? 'badge-instalado' : 'badge-disponivel'}">${statusLabel}</span></td>
                        </tr>
                    `;
                });
                tbodyCusto.innerHTML = htmlCusto;
            }

            // Custo de Peças por Veículo
            const tbodyPecas = document.getElementById('relatorioCustoPecasBody');
            let pecasInstaladas = pecas.filter(p => p.status === 'instalado');

            if (filtroVeiculo || filtroMotorista) {
                const placas = veiculosFiltrados.map(v => v.placa);
                pecasInstaladas = pecasInstaladas.filter(p => {
                    return p.veiculoInstalado && placas.includes(p.veiculoInstalado);
                });
            }

            if (pecasInstaladas.length === 0) {
                tbodyPecas.innerHTML = `<tr><td colspan="5" class="empty-state"><p>Nenhuma peça instalada em veículos.</p></td></tr>`;
            } else {
                const custoPorVeiculo = {};
                pecasInstaladas.forEach(p => {
                    const veiculo = p.veiculoInstalado || 'Não identificado';
                    if (!custoPorVeiculo[veiculo]) {
                        custoPorVeiculo[veiculo] = { total: 0, quantidade: 0 };
                    }
                    custoPorVeiculo[veiculo].total += p.valor;
                    custoPorVeiculo[veiculo].quantidade += 1;
                });

                let htmlPecas = '';
                let indexPecas = 0;
                Object.entries(custoPorVeiculo).forEach(([veiculo, dados]) => {
                    indexPecas++;
                    let veiculoInfo = veiculo;
                    const veiculoEncontrado = veiculosFiltrados.find(v => v.placa === veiculo || 
                        `${v.marca} ${v.modelo}` === veiculo);
                    if (veiculoEncontrado) {
                        veiculoInfo = `${veiculoEncontrado.marca} ${veiculoEncontrado.modelo}`;
                    }

                    htmlPecas += `
                        <tr>
                            <td>${indexPecas}</td>
                            <td><strong>${veiculoInfo}</strong></td>
                            <td>${veiculo}</td>
                            <td>${dados.quantidade}</td>
                            <td>R$ ${dados.total.toFixed(2)}</td>
                        </tr>
                    `;
                });
                tbodyPecas.innerHTML = htmlPecas;
            }

            // Custos de Manutenção por Veículo
            const tbodyManutencao = document.getElementById('relatorioCustoManutencaoBody');

            if (filtroVeiculo || filtroMotorista) {
                const placas = veiculosFiltrados.map(v => v.placa);
                manutencoes = manutencoes.filter(m => {
                    return m.veiculoPlaca && placas.includes(m.veiculoPlaca);
                });
            }

            if (manutencoes.length === 0) {
                tbodyManutencao.innerHTML = `<tr><td colspan="5" class="empty-state"><p>Nenhuma manutenção registrada.</p></td></tr>`;
            } else {
                const custoManutencao = {};
                manutencoes.forEach(m => {
                    const key = m.veiculoPlaca || 'Não identificado';
                    if (!custoManutencao[key]) {
                        custoManutencao[key] = { total: 0, quantidade: 0, marca: m.veiculoMarca || '', modelo: m.veiculoModelo || '' };
                    }
                    custoManutencao[key].total += m.valor;
                    custoManutencao[key].quantidade += 1;
                });

                let htmlManutencao = '';
                let indexManutencao = 0;
                Object.entries(custoManutencao).forEach(([placa, dados]) => {
                    indexManutencao++;
                    const nomeVeiculo = dados.marca && dados.modelo ? `${dados.marca} ${dados.modelo}` : placa;

                    htmlManutencao += `
                        <tr>
                            <td>${indexManutencao}</td>
                            <td><strong>${nomeVeiculo}</strong></td>
                            <td>${placa}</td>
                            <td>${dados.quantidade}</td>
                            <td>R$ ${dados.total.toFixed(2)}</td>
                        </tr>
                    `;
                });
                tbodyManutencao.innerHTML = htmlManutencao;
            }

            // Histórico de Pneus Removidos
            const tbodyHistorico = document.getElementById('relatorioHistoricoBody');
            const removidos = [];

            pneus.forEach(p => {
                if (p.historico) {
                    p.historico.forEach(h => {
                        if (h.acao === 'Remoção') {
                            removidos.push({
                                pneu: p,
                                historico: h,
                                veiculo: p.veiculoInstalado || 'Não identificado',
                                posicao: p.posicao || 'Não informado'
                            });
                        }
                    });
                }
            });

            const descartados = getDescartados();
            descartados.forEach(p => {
                if (filtroVeiculo && p.veiculoInstalado !== filtroVeiculo) return;
                if (filtroPneu && p.nome !== filtroPneu) return;
                removidos.push({
                    pneu: p,
                    historico: {
                        detalhes: `Descartado - ${p.motivoDescarte || 'Sem motivo'}`
                    },
                    veiculo: p.veiculoInstalado || 'Não identificado',
                    posicao: p.posicao || 'Não informado',
                    isDescartado: true
                });
            });

            if (removidos.length === 0) {
                tbodyHistorico.innerHTML = `<tr><td colspan="9" class="empty-state"><p>Nenhum pneu removido ainda.</p></td></tr>`;
            } else {
                let htmlHistorico = '';
                let indexHistorico = 0;
                removidos.slice(0, 50).forEach(r => {
                    indexHistorico++;
                    const p = r.pneu;
                    const custoPorKm = (p.kmTotal || 0) > 0 ? p.valor / (p.kmTotal || 1) : p.valor;

                    htmlHistorico += `
                        <tr>
                            <td>${indexHistorico}</td>
                            <td><strong>${p.nome}</strong> (${p.tamanho})</td>
                            <td>${r.veiculo}</td>
                            <td>${r.posicao}</td>
                            <td>R$ ${p.valor.toFixed(2)}</td>
                            <td>${(p.kmTotal || 0).toLocaleString('pt-BR')}</td>
                            <td>${(p.kmTotal || 0) > 0 ? `R$ ${custoPorKm.toFixed(4)}` : 'N/A'}</td>
                            <td><span class="badge badge-descarte">${r.isDescartado ? 'Descartado' : 'Removido'}</span></td>
                            <td>${p.dataDescarte || r.historico?.data || '-'}</td>
                        </tr>
                    `;
                });
                tbodyHistorico.innerHTML = htmlHistorico;
            }

            renderDesgasteRelatorio(pneus);
        }

        function renderDesgasteRelatorio(pneus) {
            const container = document.getElementById('desgasteRelatorioContainer');
            
            const pneusComFaixas = pneus.filter(p => p.faixas && (p.faixas.f1 > 0 || p.faixas.f2 > 0 || p.faixas.f3 > 0 || p.faixas.f4 > 0));

            if (pneusComFaixas.length === 0) {
                container.innerHTML = `<div class="empty-state"><p>Nenhum dado de desgaste registrado.</p></div>`;
                return;
            }

            let html = `<div class="desgaste-grid">`;
            
            pneusComFaixas.forEach(p => {
                const faixas = p.faixas;
                const valores = [faixas.f1 || 0, faixas.f2 || 0, faixas.f3 || 0, faixas.f4 || 0];
                const media = valores.reduce((a, b) => a + b, 0) / valores.filter(v => v > 0).length || 0;
                const desgasteEstimado = media > 0 ? (media / 16) * 100 : 0;
                const statusDesgaste = desgasteEstimado > 70 ? '🟢 Bom' : desgasteEstimado > 40 ? '🟡 Atenção' : '🔴 Trocar';

                const barras = valores.map(v => {
                    const percentual = (v / 16) * 100;
                    let classe = 'barra';
                    if (percentual > 60) classe += ' preenchida';
                    else if (percentual > 30) classe += ' media';
                    else classe += ' baixa';
                    return `<div class="${classe}" style="width:${Math.max(5, percentual)}%;"></div>`;
                }).join('');

                html += `
                    <div class="desgaste-item">
                        <div style="font-weight:600; color:#1a3a5c;">${p.nome}</div>
                        <div style="font-size:12px; color:#666;">${p.tamanho} • ${p.posicao || 'N/A'}</div>
                        <div class="valor">${media.toFixed(1)} mm</div>
                        <div class="label">Média das faixas</div>
                        <div class="faixa-indicador">${barras}</div>
                        <div style="margin-top:5px; font-size:12px; font-weight:600; color:${desgasteEstimado > 70 ? '#2e7d32' : desgasteEstimado > 40 ? '#f57c00' : '#c62828'}">
                            ${statusDesgaste} (${desgasteEstimado.toFixed(0)}%)
                        </div>
                        <div style="font-size:11px; color:#999; margin-top:3px;">
                            F1: ${faixas.f1 || 0}mm | F2: ${faixas.f2 || 0}mm | F3: ${faixas.f3 || 0}mm | F4: ${faixas.f4 || 0}mm
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        function limparFiltrosRelatorios() {
            document.getElementById('filtroRelatorioVeiculo').value = '';
            document.getElementById('filtroRelatorioMotorista').value = '';
            document.getElementById('filtroRelatorioDataInicio').value = '';
            document.getElementById('filtroRelatorioDataFim').value = '';
            document.getElementById('filtroRelatorioPneu').value = '';
            document.getElementById('filtroRelatorioEixo').value = '';
            renderRelatorios();
        }

        // ============================================
        //  VEÍCULOS - CRUD
        // ============================================
        function excluirVeiculo(id) {
            if (!confirm('Tem certeza que deseja excluir este veículo? Isso devolverá todos os pneus e peças ao estoque.')) return;

            const veiculos = getVeiculos();
            const veiculo = veiculos.find(v => v.id === id);

            if (veiculo) {
                if (veiculo.pneus) {
                    const pneus = getPneus();
                    Object.values(veiculo.pneus).forEach(pneuId => {
                        const pneu = pneus.find(p => p.id === pneuId);
                        if (pneu) {
                            pneu.status = 'disponivel';
                            pneu.veiculoInstalado = null;
                            pneu.veiculoId = null;
                            pneu.posicao = null;
                            pneu.kmInstalacao = null;
                            pneu.historico = pneu.historico || [];
                            pneu.historico.push({
                                data: new Date().toLocaleString('pt-BR'),
                                acao: 'Remoção (Exclusão Veículo)',
                                detalhes: `Pneu removido do veículo ${veiculo.placa} - ${veiculo.marca} ${veiculo.modelo}`
                            });
                        }
                    });
                    setPneus(pneus);
                }

                if (veiculo.pecas) {
                    const pecas = getPecas();
                    Object.values(veiculo.pecas).forEach(pecaId => {
                        const peca = pecas.find(p => p.id === pecaId);
                        if (peca) {
                            peca.status = 'disponivel';
                            peca.veiculoInstalado = null;
                            peca.veiculoId = null;
                            peca.posicao = null;
                            peca.dataInstalacao = null;
                            peca.kmInstalacao = null;
                            peca.historico = peca.historico || [];
                            peca.historico.push({
                                data: new Date().toLocaleString('pt-BR'),
                                acao: 'Remoção (Exclusão Veículo)',
                                detalhes: `Peça removida do veículo ${veiculo.placa} - ${veiculo.marca} ${veiculo.modelo}`
                            });
                        }
                    });
                    setPecas(pecas);
                }

                let manutencoes = getManutencoes();
                manutencoes = manutencoes.filter(m => m.veiculoId !== id);
                setManutencoes(manutencoes);
            }

            const novosVeiculos = veiculos.filter(v => v.id !== id);
            setVeiculos(novosVeiculos);
            atualizarSelectMotoristas();
            renderVeiculos();
            renderManutencao();
            renderEstoque();
            renderPecas();
            renderRelatorios();
            atualizarLimitesUI();
        }

        function toggleStatusVeiculo(id) {
            let veiculos = getVeiculos();
            const idx = veiculos.findIndex(v => v.id === id);
            if (idx !== -1) {
                veiculos[idx].status = veiculos[idx].status === 'ativo' ? 'inativo' : 'ativo';
                setVeiculos(veiculos);
                renderVeiculos();
                renderManutencao();
            }
        }

        // ============================================
        //  MODAL DO CAMINHÃO - COM EDIÇÃO DE KM
        // ============================================
        let veiculoAtual = null;
        let slotSelecionado = null;
        let pneuSelecionadoId = null;
        let veiculoInstalacaoId = null;
        let modoEdicaoKm = false;

        function abrirModalCaminhao(id) {
            const veiculos = getVeiculos();
            const veiculo = veiculos.find(v => v.id === id);
            if (!veiculo) return;

            if (veiculo.combinadoCom) {
                const combinado = veiculos.find(v => v.id === veiculo.combinadoCom);
                if (combinado) {
                    veiculoAtual = {
                        ...veiculo,
                        pneus: { ...veiculo.pneus, ...combinado.pneus },
                        estruturaEixos: [...veiculo.estruturaEixos, ...combinado.estruturaEixos],
                        eixos: veiculo.eixos + combinado.eixos,
                        placa: `${veiculo.placa} + ${combinado.placa}`,
                        _combinadoOriginal: combinado,
                        _idOriginal: veiculo.id
                    };
                    document.getElementById('modoCombinadoInfo').style.display = 'block';
                    document.getElementById('modoCombinadoInfo').innerHTML = `
                        🔗 Veículo combinado com <strong>${combinado.marca} ${combinado.modelo}</strong> (${combinado.placa})
                        <button class="btn-desvincular" onclick="desvincularVeiculos(${veiculo.id})">Desvincular</button>
                    `;
                } else {
                    veiculoAtual = veiculo;
                    document.getElementById('modoCombinadoInfo').style.display = 'none';
                }
            } else {
                veiculoAtual = veiculo;
                document.getElementById('modoCombinadoInfo').style.display = 'none';
            }
            
            const totalPecas = getPecas().filter(p => p.veiculoId === id && p.status === 'instalado').length;
            document.getElementById('modalVeiculoTitle').textContent = 
                `${veiculo.marca} ${veiculo.modelo} - ${veiculo.placa}  |  🔧 ${totalPecas} peça(s)  |  🚛 ${veiculo.eixos} eixos`;
            
            // Atualizar info top com edição de KM
            atualizarInfoKm(veiculoAtual);
            
            // Resumo e alertas
            let resumoHtml = '';
            let alertas = [];
            
            if (veiculo.servicos && veiculo.servicos.length > 0) {
                const ultimo = veiculo.servicos[veiculo.servicos.length - 1];
                const diasPassados = Math.floor((Date.now() - new Date(ultimo.data).getTime()) / (1000 * 60 * 60 * 24));
                if (diasPassados > 180) {
                    alertas.push(`<span class="alerta">⚠️ ${ultimo.tipo} há ${diasPassados} dias</span>`);
                } else if (diasPassados > 90) {
                    alertas.push(`<span class="atencao">🟡 ${ultimo.tipo} há ${diasPassados} dias</span>`);
                } else {
                    alertas.push(`<span class="ok">✅ ${ultimo.tipo} há ${diasPassados} dias</span>`);
                }
            }
            
            if (veiculo.pneus) {
                const pneus = getPneus();
                Object.values(veiculo.pneus).forEach(pneuId => {
                    const pneu = pneus.find(p => p.id === pneuId);
                    if (pneu) {
                        if (verificarAlertaDesgaste(pneu)) {
                            alertas.push(`<span class="alerta">🔴 ${pneu.nome} - desgaste crítico</span>`);
                        }
                        const diff = calcularDiferencaFaixas(pneu);
                        if (diff > 1) {
                            alertas.push(`<span class="atencao">🟡 ${pneu.nome} - diferença > 1mm</span>`);
                        }
                    }
                });
            }
            
            if (alertas.length === 0) {
                resumoHtml = '<span class="ok">✅ Nenhum alerta crítico</span>';
            } else {
                resumoHtml = alertas.join(' ');
            }
            
            document.getElementById('modalInfoResumo').innerHTML = resumoHtml;
            
            document.getElementById('modalCaminhao').classList.add('show');
            renderCaminhao(veiculoAtual);
            renderServicosAlinhamento(veiculoAtual);
        }

        function atualizarInfoKm(veiculo) {
            const container = document.querySelector('.modal-info-top .info-km');
            const kmAtual = veiculo.km || 0;
            
            container.innerHTML = `
                <span class="km-valor">📊 KM: ${kmAtual.toLocaleString('pt-BR')}</span>
                <button class="btn-editar-km" onclick="toggleEdicaoKm()" title="Editar KM">✏️</button>
                <input type="number" class="input-km-edicao" id="inputEdicaoKm" value="${kmAtual}" min="0" step="1">
                <button class="btn-confirmar-km" onclick="confirmarEdicaoKm()">✅</button>
                <button class="btn-cancelar-km" onclick="cancelarEdicaoKm()">❌</button>
            `;
            
            modoEdicaoKm = false;
        }

        function toggleEdicaoKm() {
            const input = document.getElementById('inputEdicaoKm');
            const confirmBtn = document.querySelector('.btn-confirmar-km');
            const cancelBtn = document.querySelector('.btn-cancelar-km');
            const editBtn = document.querySelector('.btn-editar-km');
            
            if (modoEdicaoKm) {
                // Fechar modo edição sem salvar
                cancelarEdicaoKm();
                return;
            }
            
            modoEdicaoKm = true;
            input.classList.add('visible');
            confirmBtn.classList.add('visible');
            cancelBtn.classList.add('visible');
            editBtn.style.display = 'none';
            input.focus();
            input.select();
        }

        function cancelarEdicaoKm() {
            const input = document.getElementById('inputEdicaoKm');
            const confirmBtn = document.querySelector('.btn-confirmar-km');
            const cancelBtn = document.querySelector('.btn-cancelar-km');
            const editBtn = document.querySelector('.btn-editar-km');
            
            modoEdicaoKm = false;
            input.classList.remove('visible');
            confirmBtn.classList.remove('visible');
            cancelBtn.classList.remove('visible');
            editBtn.style.display = 'inline';
            
            // Restaurar valor original
            if (veiculoAtual) {
                input.value = veiculoAtual.km || 0;
            }
        }

        function confirmarEdicaoKm() {
            const input = document.getElementById('inputEdicaoKm');
            const novaKm = parseInt(input.value);
            
            if (isNaN(novaKm) || novaKm < 0) {
                alert('Por favor, informe uma quilometragem válida.');
                return;
            }
            
            if (novaKm < (veiculoAtual.km || 0)) {
                if (!confirm('A nova quilometragem é menor que a atual. Isso pode afetar o cálculo dos pneus. Continuar?')) {
                    return;
                }
            }
            
            // Atualizar KM do veículo
            const veiculos = getVeiculos();
            const veiculoOriginal = veiculos.find(v => v.id === (veiculoAtual._idOriginal || veiculoAtual.id));
            
            if (veiculoOriginal) {
                const kmAntigo = veiculoOriginal.km || 0;
                veiculoOriginal.km = novaKm;
                
                // Atualizar KM total dos pneus instalados
                if (veiculoOriginal.pneus) {
                    const pneus = getPneus();
                    Object.values(veiculoOriginal.pneus).forEach(pneuId => {
                        const pneu = pneus.find(p => p.id === pneuId);
                        if (pneu && pneu.kmInstalacao !== null) {
                            // Atualiza KM total baseado na diferença da nova KM
                            const kmRodado = Math.max(0, novaKm - pneu.kmInstalacao);
                            // Só atualiza se a nova KM for maior que a anterior
                            if (novaKm > kmAntigo) {
                                pneu.kmTotal = (pneu.kmTotal || 0) + (novaKm - kmAntigo);
                            } else if (novaKm < kmAntigo) {
                                // Se a KM diminuiu, subtrai a diferença (mas não permite KM total negativo)
                                pneu.kmTotal = Math.max(0, (pneu.kmTotal || 0) - (kmAntigo - novaKm));
                            }
                            pneu.historico = pneu.historico || [];
                            pneu.historico.push({
                                data: new Date().toLocaleString('pt-BR'),
                                acao: 'Atualização KM',
                                detalhes: `KM do veículo atualizada de ${kmAntigo} para ${novaKm}. KM Total do pneu: ${pneu.kmTotal}`
                            });
                        }
                    });
                    setPneus(pneus);
                }
                
                setVeiculos(veiculos);
                
                // Atualizar veiculoAtual
                veiculoAtual.km = novaKm;
                if (veiculoAtual._combinadoOriginal) {
                    // Se for combinado, atualiza também o original
                    const combinadoOriginal = veiculos.find(v => v.id === veiculoAtual._combinadoOriginal.id);
                    if (combinadoOriginal) {
                        combinadoOriginal.km = novaKm;
                        setVeiculos(veiculos);
                    }
                }
            }
            
            // Fechar modo edição
            modoEdicaoKm = false;
            const editBtn = document.querySelector('.btn-editar-km');
            editBtn.style.display = 'inline';
            
            // Atualizar display da KM
            const kmValor = document.querySelector('.km-valor');
            if (kmValor) {
                kmValor.textContent = `📊 KM: ${novaKm.toLocaleString('pt-BR')}`;
            }
            
            // Ocultar campos de edição
            document.getElementById('inputEdicaoKm').classList.remove('visible');
            document.querySelector('.btn-confirmar-km').classList.remove('visible');
            document.querySelector('.btn-cancelar-km').classList.remove('visible');
            
            // Re-renderizar o caminhão para atualizar informações dos pneus
            renderCaminhao(veiculoAtual);
            renderVeiculos();
            renderEstoque();
            renderRelatorios();
            
            alert(`✅ KM atualizada para ${novaKm.toLocaleString('pt-BR')}. KM total dos pneus atualizada.`);
        }

            document.getElementById('modalCaminhao').classList.remove('show');
            veiculoAtual = null;

        function renderServicosAlinhamento(veiculo) {
            const container = document.getElementById('listaServicosAlinhamento');
            const servicos = veiculo.servicos || [];
            
            if (servicos.length === 0) {
                container.innerHTML = '<div style="color:#999; font-style:italic; text-align:center; padding:10px;">Nenhum serviço registrado</div>';
                return;
            }
            
            let html = '';
            servicos.sort((a, b) => new Date(b.data) - new Date(a.data)).forEach(s => {
                const diasPassados = Math.floor((Date.now() - new Date(s.data).getTime()) / (1000 * 60 * 60 * 24));
                let alertaClass = 'ok';
                let alertaText = '✅ OK';
                if (diasPassados > 180) {
                    alertaClass = 'critico';
                    alertaText = `⚠️ ${diasPassados} dias`;
                } else if (diasPassados > 90) {

                        <div>
                            <span class="alerta-tempo ${alertaClass}">${alertaText}</span>
                            <span style="margin-left:10px; font-size:13px; color:#555;">R$ ${s.valor.toFixed(2)}</span>

        function renderCaminhao(veiculo) {

            const estrutura = veiculo.estruturaEixos || [];
            
            if (estrutura.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>Estrutura de eixos não definida.</p></div>';

                const slots = [];
                if (qtd === 2) {
                    slots.push({ id: `${eixoNome.toLowerCase().replace(/ /g, '-')}-esquerdo`, label: 'E' });
                    slots.push({ id: `${eixoNome.toLowerCase().replace(/ /g, '-')}-direito`, label: 'D' });
                } else if (qtd === 4) {
                    slots.push({ id: `${eixoNome.toLowerCase().replace(/ /g, '-')}-esquerdo-externo`, label: 'EE' });
                    slots.push({ id: `${eixoNome.toLowerCase().replace(/ /g, '-')}-esquerdo-interno`, label: 'EI' });
                    slots.push({ id: `${eixoNome.toLowerCase().replace(/ /g, '-')}-direito-interno`, label: 'DI' });
                    slots.push({ id: `${eixoNome.toLowerCase().replace(/ /g, '-')}-direito-externo`, label: 'DE' });

                    for (let i = 1; i <= qtd; i++) {
                        slots.push({ id: `${eixoNome.toLowerCase().replace(/ /g, '-')}-${i}`, label: `${i}` });

                const isDianteiro = tipo === 'dianteiro';
                const eixoClass = isDianteiro ? 'eixo-dianteiro' : '';

                html += `
                    <div class="eixos-row">

                            <div class="eixo-pneus">

                                ${renderPneuSlot(veiculo, 'estepe-2', veiculo.pneus ? veiculo.pneus['estepe-2'] : null, true)}
                                ${renderPneuSlot(veiculo, 'estepe-3', veiculo.pneus ? veiculo.pneus['estepe-3'] : null, true)}
                                ${renderPneuSlot(veiculo, 'estepe-4', veiculo.pneus ? veiculo.pneus['estepe-4'] : null, true)}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Peças Instaladas
            const pecas = getPecas();

            html += `
                <div style="width:100%; margin-top:25px;">
                    <div class="pecas-titulo-modal">
                        <span>🔧 Peças Instaladas</span>
                        <span>${pecasInstaladas.length}</span>

            if (pecasInstaladas.length === 0) {
                html += `

                            <div class="detalhe"><strong>Instalado em:</strong> ${p.dataInstalacao || 'N/A'}</div>

        // ============================================
        //  RENDER PNEU SLOT
        // ============================================
        function renderPneuSlot(veiculo, slotId, pneuId, isEstepe = false) {
            const pneus = getPneus();
            const pneu = pneuId ? pneus.find(p => p.id === pneuId) : null;

            const slotClass = isEstepe ? 'estepe' : '';
            const ocupadoClass = pneu ? 'ocupado' : '';
            const alertaClass = pneu && verificarAlertaDesgaste(pneu) ? 'alerta' : '';

            if (pneu) {
                const faixas = pneu.faixas || {};
                const temAlerta = verificarAlertaDesgaste(pneu);
                const diff = calcularDiferencaFaixas(pneu);
                const mmRef = parseFloat(document.getElementById('mmReferencia')?.value) || 16;
                const vidaRestante = estimarVidaRestante(pneu, mmRef);
                
                let tipoDisplay = pneu.tipo;
                if (pneu.tipoRecapagem) {
                    const tipoMap = {
                        'banda_leve': 'Banda Leve',
                        'misto': 'Misto',
                        'borrachudo': 'Borrachudo',
                        'outros': pneu.tipoRecapagemOutros || 'Outros'
                    };
                    tipoDisplay = tipoMap[pneu.tipoRecapagem] || pneu.tipoRecapagem;
                }

                const contadorRecap = pneu.contadorRecapagens || 0;

                return `
                    <div class="pneu-slot ${ocupadoClass} ${slotClass} ${alertaClass}" 
                         draggable="true"
                         ondragstart="iniciarDrag(event, ${veiculo.id}, '${slotId}')"
                         ondragend="limparDrag(event)"
                         onclick="abrirModalFaixas(${veiculo.id}, '${slotId}')">
                        <div class="pneu-info">${pneu.nome}
                            ${contadorRecap > 0 ? `<span style="font-size:8px;background:#ff8a65;color:#fff;padding:1px 6px;border-radius:8px;display:inline-block;margin-left:2px;">${contadorRecap}x</span>` : ''}
                        </div>
                        <div class="pneu-detalhes">${pneu.tamanho} • ${tipoDisplay}</div>
                        <div class="pneu-detalhes" style="font-size:8px; color:#666;">
                            F1: ${faixas.f1 || 0}mm | F2: ${faixas.f2 || 0}mm
                        </div>
                        <div class="pneu-detalhes" style="font-size:8px; color:#666;">
                            F3: ${faixas.f3 || 0}mm | F4: ${faixas.f4 || 0}mm
                        </div>
                        ${temAlerta ? '<div style="font-size:9px; color:#c62828; font-weight:700;">⚠️ ATENÇÃO!</div>' : ''}
                        ${diff > 1 ? '<div style="font-size:8px; color:#f57c00;">📏 Dif > 1mm</div>' : ''}
                        ${vidaRestante && vidaRestante.km > 0 ? `<div class="pneu-vida-restante">${vidaRestante.km.toLocaleString('pt-BR')}km</div>` : ''}
                        <button class="remove-pneu" onclick="event.stopPropagation(); abrirModalRemocao(${veiculo.id}, '${slotId}')">✕</button>
                    </div>
                `;
            } else {
                return `
                    <div class="pneu-slot ${slotClass}"
                         ondragover="permitirDrop(event)"
                         ondragleave="limparDrag(event)"
                         ondrop="finalizarDrop(event, ${veiculo.id}, '${slotId}')"
                         onclick="abrirModalSelecao(${veiculo.id}, '${slotId}')">
                        <span style="font-size:20px;">➕</span>
                        ${isEstepe ? '<div style="font-size:8px;color:#f57c00;">Estepe</div>' : ''}
                    </div>
                `;
            }
        }

        // ============================================
        //  MODAL DE FAIXAS
        // ============================================
        let veiculoFaixasId = null;
        let slotFaixasId = null;

        function abrirModalFaixas(veiculoId, slotId) {
            const veiculos = getVeiculos();
            const veiculo = veiculos.find(v => v.id === veiculoId);
            if (!veiculo || !veiculo.pneus) return;

            const pneuId = veiculo.pneus[slotId];
            if (!pneuId) return;

            const pneus = getPneus();
            const pneu = pneus.find(p => p.id === pneuId);
            if (!pneu) return;

            veiculoFaixasId = veiculoId;
            slotFaixasId = slotId;

            const faixas = pneu.faixas || { f1: 0, f2: 0, f3: 0, f4: 0 };
            const nomeSlot = slotId.replace(/-/g, ' ').replace(/estepe/g, 'Estepe');

            const modal = document.getElementById('modalFaixas');
            
            document.getElementById('modalFaixasTitle').textContent = `📏 Medição de Desgaste - ${pneu.nome}`;

                    <div><strong>Tamanho:</strong> ${pneu.tamanho}</div>
                    <div><strong>Tipo:</strong> ${pneu.tipo}</div>

                </div>
            `;

            document.getElementById('faixaF1').value = faixas.f1 || 0;
            document.getElementById('faixaF2').value = faixas.f2 || 0;
            document.getElementById('faixaF3').value = faixas.f3 || 0;
            document.getElementById('faixaF4').value = faixas.f4 || 0;

            ['F1', 'F2', 'F3', 'F4'].forEach(f => {
                const input = document.getElementById(`faixa${f}`);
                if (input) {
                    input.removeEventListener('input', window._faixaInputHandler);
                    const handler = function() {
                        atualizarStatusFaixa(f);
                        atualizarResumoFaixasCompleto();
                    };
                    window._faixaInputHandler = handler;
                    input.addEventListener('input', handler);
                }
            });

            document.getElementById('mmReferencia').removeEventListener('change', window._mmRefHandler);
            const mmHandler = function() {
                atualizarResumoFaixasCompleto();
            };
            window._mmRefHandler = mmHandler;
            document.getElementById('mmReferencia').addEventListener('change', mmHandler);

            atualizarStatusFaixa('F1');
            atualizarStatusFaixa('F2');
            atualizarStatusFaixa('F3');
            atualizarStatusFaixa('F4');
            atualizarResumoFaixasCompleto();

        function atualizarStatusFaixa(faixa) {
            const input = document.getElementById(`faixa${faixa}`);
            const statusEl = document.getElementById(`status${faixa}`);
            if (!input || !statusEl) return;

            const valor = parseFloat(input.value) || 0;
            
            if (valor === 0) {
                statusEl.textContent = '⏳ Não medido';
                statusEl.style.background = '#e0e0e0';
                statusEl.style.color = '#666';
            } else if (valor < 5) {
                statusEl.textContent = '🔴 CRÍTICO!';
                statusEl.style.background = '#ffcdd2';
                statusEl.style.color = '#c62828';
            } else if (valor < 8) {
                statusEl.textContent = '🟡 ATENÇÃO';
                statusEl.style.background = '#fff9c4';
                statusEl.style.color = '#f57f17';
            } else {
                statusEl.textContent = '🟢 OK';
                statusEl.style.background = '#c8e6c9';
                statusEl.style.color = '#1b5e20';
            }
        }

        function atualizarResumoFaixasCompleto() {
            const valores = [];
            for (let i = 1; i <= 4; i++) {
                const input = document.getElementById(`faixaF${i}`);
                if (input) {
                    const val = parseFloat(input.value) || 0;
                    if (val > 0) valores.push(val);
                }
            }

            const mediaEl = document.getElementById('mediaFaixas');
            const desgasteEl = document.getElementById('desgasteEstimado');
            const statusEl = document.getElementById('statusGeral');
            const vidaEl = document.getElementById('vidaRestante');
            const analiseEl = document.getElementById('analiseDetalhada');

            if (valores.length === 0) {
                mediaEl.textContent = '0.0 mm';
                desgasteEl.textContent = '0%';
                statusEl.textContent = '⏳ Sem dados';
                statusEl.style.background = '#e0e0e0';
                statusEl.style.color = '#666';
                vidaEl.textContent = '-';
                analiseEl.textContent = '';
                return;
            }

            const media = valores.reduce((a, b) => a + b, 0) / valores.length;
            const mmRef = parseFloat(document.getElementById('mmReferencia')?.value) || 16;
            const desgaste = ((mmRef - media) / mmRef) * 100;
            const diff = Math.max(...valores) - Math.min(...valores);

            mediaEl.textContent = `${media.toFixed(1)} mm`;
            desgasteEl.textContent = `${Math.min(100, Math.max(0, desgaste)).toFixed(0)}%`;

            const temCritico = valores.some(v => v < 5);
            const temAtencao = valores.some(v => v >= 5 && v < 8);

            if (temCritico) {
                statusEl.textContent = '🔴 CRÍTICO - Trocar!';
                statusEl.style.background = '#ffcdd2';
                statusEl.style.color = '#c62828';
            } else if (temAtencao) {
                statusEl.textContent = '🟡 ATENÇÃO - Monitorar';
                statusEl.style.background = '#fff9c4';
                statusEl.style.color = '#f57f17';
            } else if (media > 0) {
                statusEl.textContent = '🟢 Bom';
                statusEl.style.background = '#c8e6c9';
                statusEl.style.color = '#1b5e20';
            }

            if (media > 3.5) {
                const mmPorKm = 0.0001;
                const kmAte3_5 = (media - 3.5) / mmPorKm;
                const diasAte3_5 = kmAte3_5 / 300;
                vidaEl.textContent = `${Math.round(kmAte3_5).toLocaleString('pt-BR')}km\n${Math.round(diasAte3_5)} dias`;
            } else {
                vidaEl.textContent = '🔴 Crítico';
            }

            let analise = '';
            if (diff > 1) {
                analise = '⚠️ <strong>Recomenda-se análise do pneu</strong> - Diferença de mais de 1mm entre as faixas.';
                analise += ' Possível desgaste irregular ou problemas de alinhamento.';
            } else if (temCritico) {
                analise = '🔴 <strong>Pneu em estado crítico</strong> - Recomenda-se a troca imediata.';
            } else if (temAtencao) {
                analise = '🟡 <strong>Monitorar pneu</strong> - Desgaste avançado, planejar substituição.';
            } else if (media > 8) {
                analise = '🟢 <strong>Pneu em bom estado</strong> - Mantenha a manutenção preventiva.';
            }
            analiseEl.innerHTML = analise;
        }

        function fecharModalFaixas() {
            document.getElementById('modalFaixas').style.display = 'none';

            slotFaixasId = null;

        function salvarFaixas() {

        // ============================================
        //  DRAG AND DROP
        // ============================================
        let dragData = null;

        function iniciarDrag(e, veiculoId, slotId) {
            const veiculos = getVeiculos();
            const veiculo = veiculos.find(v => v.id === veiculoId);
            if (!veiculo || !veiculo.pneus) return;
            
            const pneuId = veiculo.pneus[slotId];
            if (!pneuId) return;

            dragData = {
                veiculoId: veiculoId,
                slotOrigem: slotId,
                pneuId: pneuId
            };

            e.target.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', slotId);
        }

        function permitirDrop(e) {
            e.preventDefault();
            e.target.closest('.pneu-slot')?.classList.add('drag-over');
        }

        function limparDrag(e) {
            document.querySelectorAll('.pneu-slot').forEach(el => {
                el.classList.remove('dragging', 'drag-over');
            });
        }

        function finalizarDrop(e, veiculoId, slotDestino) {
            e.preventDefault();
            limparDrag(e);

            if (!dragData) return;
            if (dragData.veiculoId !== veiculoId) {
                alert('Não é possível mover pneus entre veículos diferentes.');
                dragData = null;
                return;
            }
            if (dragData.slotOrigem === slotDestino) {
                dragData = null;
                return;
            }

            const veiculos = getVeiculos();
            const veiculo = veiculos.find(v => v.id === veiculoId);
            if (!veiculo || !veiculo.pneus) {
                dragData = null;
                return;
            }

            const pneuDestinoId = veiculo.pneus[slotDestino];
            const pneuOrigemId = veiculo.pneus[dragData.slotOrigem];
            if (!pneuOrigemId) {
                dragData = null;
                return;
            }

            const pneus = getPneus();
            const pneu = pneus.find(p => p.id === pneuOrigemId);
            if (pneu) {
                pneu.posicao = slotDestino.replace(/-/g, ' ');
                pneu.historico = pneu.historico || [];
                pneu.historico.push({
                    data: new Date().toLocaleString('pt-BR'),
                    acao: 'Movimentação',
                    detalhes: `Pneu movido de ${dragData.slotOrigem} para ${slotDestino} no veículo ${veiculo.placa}`
                });
                setPneus(pneus);
            }

            delete veiculo.pneus[dragData.slotOrigem];
            if (pneuDestinoId) {
                veiculo.pneus[dragData.slotOrigem] = pneuDestinoId;
            }
            veiculo.pneus[slotDestino] = pneuOrigemId;

            const idx = veiculos.findIndex(v => v.id === veiculoId);
            if (idx !== -1) {
                veiculos[idx] = veiculo;
                setVeiculos(veiculos);
            }

            dragData = null;
            renderCaminhao(veiculo);
            renderVeiculos();
            renderEstoque();
            renderRelatorios();
        }

        function fecharModalInstalacao() {
            document.getElementById('modalInstalacao').classList.remove('show');
            pneuSelecionadoId = null;
        }

        function confirmarInstalacao() {
            if (!veiculoAtual || !slotSelecionado || !pneuSelecionadoId) {
                alert('Erro: Dados incompletos para instalação.');
                fecharModalInstalacao();
                return;
            }

            const km = parseInt(document.getElementById('kmInstalacao').value);
            if (!km || km < 0) {
                alert('Por favor, informe uma quilometragem válida.');
                return;
            }

            if (km < veiculoAtual.km) {
                alert('A quilometragem não pode ser menor que a atual do veículo.');
                return;
            }

            const veiculos = getVeiculos();
            const idx = veiculos.findIndex(v => v.id === veiculoAtual.id);
            if (idx !== -1) {
                veiculos[idx].km = km;
                veiculoAtual.km = km;
                setVeiculos(veiculos);
            }

            const pneus = getPneus();
            const pneu = pneus.find(p => p.id === pneuSelecionadoId);
            if (!pneu) {
                alert('Pneu não encontrado no estoque.');
                fecharModalInstalacao();
                return;
            }

            pneu.kmTotal = pneu.kmTotal || 0;
            pneu.status = 'instalado';
            pneu.veiculoInstalado = veiculoAtual.placa;
            pneu.veiculoId = veiculoAtual.id;
            pneu.posicao = slotSelecionado.replace(/-/g, ' ');
            pneu.kmInstalacao = km;

            if (!veiculoAtual.pneus) veiculoAtual.pneus = {};
            veiculoAtual.pneus[slotSelecionado] = pneuSelecionadoId;

            pneu.historico = pneu.historico || [];
            pneu.historico.push({
                data: new Date().toLocaleString('pt-BR'),
                acao: 'Instalação',
                detalhes: `Instalado no veículo ${veiculoAtual.placa} - ${veiculoAtual.marca} ${veiculoAtual.modelo} na posição ${slotSelecionado} com KM ${km}`
            });

            setPneus(pneus);

            const idxVeiculo = veiculos.findIndex(v => v.id === veiculoAtual.id);
            if (idxVeiculo !== -1) {
                veiculos[idxVeiculo] = veiculoAtual;
                setVeiculos(veiculos);
            }

            const slotTemp = slotSelecionado;
            const veiculoTemp = veiculoAtual;

            fecharModalInstalacao();
            
            renderCaminhao(veiculoTemp);
            renderVeiculos();
            renderEstoque();
            renderRelatorios();
            
            alert(`✅ Pneu ${pneu.nome} instalado com sucesso!`);
        }

            if (!km || km < 0) {
                alert('Por favor, informe uma quilometragem válida.');
                return;

                alert('A quilometragem não pode ser menor que a atual do veículo.');
                return;
            }

            if (!destino) {
                alert('Por favor, selecione o destino do pneu.');
                return;
            }

            const veiculos = getVeiculos();
            const idx = veiculos.findIndex(v => v.id === veiculoAtual.id);
            if (idx !== -1) {
                veiculos[idx].km = km;
                veiculoAtual.km = km;
                setVeiculos(veiculos);
            }

            const pneuId = veiculoAtual.pneus[slotRemocao];
            if (!pneuId) {
                alert('Erro: Pneu não encontrado.');
                fecharModalRemocao();
                return;
            }

            const pneus = getPneus();
            const pneu = pneus.find(p => p.id === pneuId);
            if (pneu) {
                if (pneu.kmInstalacao !== null) {
                    const kmRodado = Math.max(0, km - pneu.kmInstalacao);
                    pneu.kmTotal = (pneu.kmTotal || 0) + kmRodado;
                }
                pneu.kmRemocao = km;
                pneu.historico = pneu.historico || [];
                pneu.historico.push({
                    data: new Date().toLocaleString('pt-BR'),
                    acao: 'Remoção',
                    detalhes: `Removido do veículo ${veiculoAtual.placa} - ${veiculoAtual.marca} ${veiculoAtual.modelo} na posição ${slotRemocao} com KM ${km}. KM Total: ${pneu.kmTotal}`
                });

                pneu.veiculoInstalado = null;
                pneu.veiculoId = null;
                pneu.posicao = null;
                pneu.kmInstalacao = null;

                pneu.status = 'recapagem';
                pneu.situacao = 'recapado';
                pneu.veiculoInstalado = null;
                pneu.veiculoId = null;
                pneu.posicao = null;
                pneu.kmInstalacao = null;
                pneu.contadorRecapagens = (pneu.contadorRecapagens || 0) + 1;
            } else if (destino === 'vulcanizacao') {

                pneu.situacao = 'vulcanizado';
                pneu.veiculoInstalado = null;
                pneu.veiculoId = null;
                pneu.posicao = null;
                pneu.kmInstalacao = null;
                pneu.contadorVulcanizacoes = (pneu.contadorVulcanizacoes || 0) + 1;

                pneu.posicao = slotRemocao.replace(/-/g, ' ');

                renderRelatorios();
